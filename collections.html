<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root{
    --navy:#0A2547;
    --navy-2:#0E3D8F;
    --blue:#1E6ADB;
    --blue-bright:#5AAAFF;
    --blue-light:rgba(90,170,255,.14);
    --bg:#0A2547;
    --card:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.18);
    --ink:#FFFFFF;
    --ink-soft:rgba(255,255,255,.55);
    --red:#C4432E;
    --green:#0F8A5F;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 26px) fixed,
      linear-gradient(180deg, #0E3D8F 0%, #0A2547 18%, #111A2C 45%, #0A0E17 100%) fixed;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:0 24px 40px;}
  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:20px 32px 20px;margin-bottom:24px;position:relative;}
  .brand-word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:#fff;line-height:1;}
  .brand-word span{color:var(--blue-bright);}
  .top-row{display:flex;justify-content:space-between;align-items:center;min-height:44px;position:relative;}
  .nav-row{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:14px;flex-wrap:wrap;}
  .nav-pill{display:inline-flex;align-items:center;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;letter-spacing:.2px;color:#fff;text-decoration:none;padding:7px 15px;border-radius:999px;transition:color .25s ease;white-space:nowrap;}
  .nav-pill.active{color:var(--blue-bright);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .empty{color:var(--ink-soft);text-align:center;padding:24px;}
</style>

<body>

<!-- ============ LOGIN GATE (same Firebase project/login as the Trading Tool) ============ -->
<style>
  #authGate{position:fixed;inset:0;background:linear-gradient(135deg,#0B2545 0%,#123A6B 100%);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;}
  .auth-box{background:#fff;border-radius:16px;width:100%;max-width:380px;padding:32px 30px;box-shadow:0 20px 60px rgba(0,0,0,.35);--ink:#0F1F33;--ink-soft:#64748B;}
  .auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;}
  .auth-logo .word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:#0B2545;}
  .auth-logo .word span{color:#1B6FC9;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:12px;font-weight:600;color:#5B6B82;margin-bottom:5px;}
  .auth-field input{width:100%;padding:10px 12px;border:1.5px solid #E1E6ED;border-radius:8px;font-size:14px;font-family:inherit;}
  .auth-field input:focus{outline:none;border-color:#1B6FC9;}
  .auth-submit{width:100%;padding:11px;border:none;border-radius:8px;background:#1B6FC9;color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;}
  .auth-msg{font-size:12.5px;margin-top:12px;padding:9px 11px;border-radius:8px;line-height:1.4;display:none;}
  .auth-msg.err{background:#FCEBE7;color:#B23A22;display:block;}
  .auth-msg.ok{background:#E3F6F4;color:#00776F;display:block;}
  .auth-note{font-size:11px;color:#9AABC2;text-align:center;margin-top:16px;line-height:1.5;}
</style>
<div id="authGate">
  <div class="auth-box">
    <div class="auth-logo">
      <svg viewBox="0 0 44 44" width="30" height="30"><circle cx="22" cy="22" r="21" fill="#123A6B" stroke="#3E7BC4" stroke-width="1.2"/><path d="M6,25 C13,19 17,29 24,23 C30,18 34,24 38,20" stroke="#5FA8E8" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="16" y="14" width="13" height="8" rx="1.4" fill="#00A9A0"/></svg>
      <div class="word">Buen<span>Trade</span> Trading OS</div>
    </div>
    <form id="formSignIn" onsubmit="return doSignIn(event)">
      <div class="auth-field"><label>Work email</label><input type="email" id="siEmail" required placeholder="name@buentradegroup.com"></div>
      <div class="auth-field"><label>Password</label><input type="password" id="siPass" required></div>
      <button class="auth-submit" type="submit">Sign In</button>
    </form>
    <div id="authMsg" class="auth-msg"></div>
    <div class="auth-note">Accounts are created from the Trading Tool. Same login works here.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyApz__ZGeVwgt1ObJYCQ6elVa9KXFZA3tM",
  authDomain: "buentrade-fc841.firebaseapp.com",
  projectId: "buentrade-fc841",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

// STAGING Trading OS API — see providers.html/plants.html for the full note. Every read/write
// goes through an Edge Function.
const API_ROOT = 'https://geqhjykbxvxugvnpnygn.supabase.co/functions/v1/';
const API_KEY = 'sb_publishable_p7na-oT05z2cPHXdzgzD6Q_Y29Hv3pe';

async function callApi(fn, body){
  const res = await fetch(API_ROOT + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY, 'apikey': API_KEY },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || res.status); err.data = data; throw err; }
  return data;
}
function currentActor(){ return (auth.currentUser && auth.currentUser.email) || 'unknown'; }

function showAuthMsg(text){
  const el = document.getElementById('authMsg');
  el.textContent = text;
  el.className = 'auth-msg err';
}

function doSignIn(e){
  e.preventDefault();
  const email = document.getElementById('siEmail').value;
  const pass = document.getElementById('siPass').value;
  auth.signInWithEmailAndPassword(email, pass)
    .then(cred => {
      if(!cred.user.emailVerified){
        showAuthMsg('Please verify your email first.');
        auth.signOut();
      }
    })
    .catch(err => showAuthMsg(err.message));
  return false;
}

function logout(){ auth.signOut(); }

auth.onAuthStateChanged(user => {
  const gate = document.getElementById('authGate');
  const app = document.getElementById('appContent');
  if (user && user.emailVerified) {
    gate.style.display = 'none';
    app.style.display = 'block';
    document.getElementById('userBadge').textContent = user.email;
  } else {
    gate.style.display = 'flex';
    app.style.display = 'none';
  }
});
</script>
<!-- ============ END LOGIN GATE ============ -->

<div id="appContent" style="display:none;">
<header>
  <div class="top-row">
    <a href="dashboard.html" style="position:absolute;left:32px;top:50%;transform:translateY(-50%);text-align:center;text-decoration:none;" title="Go to Dashboard"><div class="brand-word">Buen<span>Trade</span><div style="font-size:14px;letter-spacing:0.1em;color:rgba(255,255,255,.75);margin-top:5px;"><b style="font-weight:800;color:var(--blue-bright);">O</b>perating <b style="font-weight:800;color:var(--blue-bright);">S</b>ystem</div></div></a>
    <div style="position:absolute;right:32px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;">
      <button onclick="logout()" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;">Log Out</button>
      <span id="userBadge" style="font-size:12px;color:rgba(255,255,255,.85);font-family:'Space Grotesk',sans-serif;font-weight:600;white-space:nowrap;text-align:center;"></span>
    </div>
  </div>
  <nav class="nav-row">
    <a href="customers.html" class="nav-pill">Clients</a>
    <a href="providers.html" class="nav-pill">Logistics</a>

    <a href="quotes.html" class="nav-pill">Quotes</a>
    <a href="offers.html" class="nav-pill">Offers</a>
    <a href="orders.html" class="nav-pill">Orders</a>
    <a href="collections.html" class="nav-pill active">Collections</a>
  </nav>
</header>

<div class="wrap">
  <h1>Collections</h1>
  <div class="card">
    <div class="empty">Coming soon.</div>
  </div>
</div>
</div>

</body>
