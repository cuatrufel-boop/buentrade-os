<style>
  :root{
    --navy:#0A2547; --navy-2:#0E3D8F; --blue:#1E6ADB; --blue-bright:#5AAAFF; --blue-light:#EAF3FC;
    --bg:#F4F7FB; --card:#FFFFFF; --line:#E2E9F2; --ink:#0F1F33; --ink-soft:#64748B; --red:#C4432E; --green:#1E9E6B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px 40px;}
  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:20px 32px 20px;margin-bottom:24px;position:relative;}
  .brand-word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:#fff;line-height:1;}
  .brand-word span{color:var(--blue-bright);}
  .top-row{display:flex;justify-content:space-between;align-items:center;min-height:44px;position:relative;}
  .nav-row{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:14px;flex-wrap:wrap;}
  .nav-pill{display:inline-flex;align-items:center;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;letter-spacing:.2px;color:#fff;text-decoration:none;padding:7px 15px;border-radius:999px;transition:color .25s ease;white-space:nowrap;}
  .nav-pill.active{color:var(--blue-bright);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 4px;}
  .subtitle{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;}
  .btn.secondary{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red);padding:5px 10px;font-size:12px;}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:center;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px;border-bottom:1.5px solid var(--line);}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center;}
  tr:last-child td{border-bottom:none;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-align:center;}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:13.5px;font-family:inherit;text-align:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  .empty{color:var(--ink-soft);text-align:center;padding:24px;}
  #formCard{display:none;}
  #searchBox{width:100%;max-width:420px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  .name-link{color:var(--blue);font-weight:600;text-decoration:none;cursor:pointer;}
  .name-link:hover{text-decoration:underline;}
  .role-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--blue-light);color:var(--blue);margin-right:4px;white-space:nowrap;}
  /* Same card-row language as Quotes/Pending/Offers/Meat Packers — bordered rounded row with an
     avatar instead of a plain table row. */
  .pkg-table-wrap{display:flex;flex-direction:column;gap:8px;}
  .pkg-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s;}
  .pkg-row:hover{border-color:#CBDCF2;box-shadow:0 3px 12px rgba(15,31,51,.07);}
  .pkg-plant-avatar{width:34px;height:34px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,#E7F0FE,#D5E5FC);color:#1E6ADB;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .pkg-plant-name{font-weight:600;color:var(--ink);font-size:13.5px;}
  .pkg-plant-sub{font-size:11.5px;color:var(--ink-soft);}
  .pkg-plant-info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:140px;}
  .role-check{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;cursor:pointer;font-size:13px;}
  .role-check input{width:auto;}
  .tab-row{display:flex;justify-content:center;gap:6px;margin-bottom:14px;border-bottom:1.5px solid var(--line);}
  .tab-btn{background:none;border:none;padding:9px 14px;font-size:15px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px;}
  .tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
  .rate-input{padding:5px 7px;border:1.5px solid var(--line);border-radius:6px;font-size:12.5px;font-family:inherit;width:100%;}
  .rate-input:focus{outline:none;border-color:var(--blue);}
  .save-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:4px;transition:background .2s;}
  .save-dot.saved{background:var(--green);}
  .save-dot.saving{background:var(--blue-bright);}
</style>
</head>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyApz__ZGeVwgt1ObJYCQ6elVa9KXFZA3tM",
  authDomain: "buentrade-fc841.firebaseapp.com",
  projectId: "buentrade-fc841",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

// STAGING Trading OS API — every read/write on this page goes through an Edge Function, never a
// direct database call. This is a deliberate architecture change (2026-08): Claude/AI and the
// frontend alike only ever call named, narrow API operations; Postgres itself is never touched
// directly by anyone but the API's own service role. Points at staging (geqhjykbxvxugvnpnygn),
// not the production database — this page shows staging data until Fase 4's real migration runs.
const API_ROOT = 'https://geqhjykbxvxugvnpnygn.supabase.co/functions/v1/';
const API_KEY = 'sb_publishable_p7na-oT05z2cPHXdzgzD6Q_Y29Hv3pe';

async function callApi(fn, body){
  const res = await fetch(API_ROOT + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY, 'apikey': API_KEY },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || res.status); err.data = data; throw err; }
  return data;
}
function currentActor(){ return (auth.currentUser && auth.currentUser.email) || 'unknown'; }

function showAuthMsg(text){
  const el = document.getElementById('authMsg');
  el.textContent = text;
  el.className = 'auth-msg err';
}
function doSignIn(e){
  e.preventDefault();
  const email = document.getElementById('siEmail').value;
  const pass = document.getElementById('siPass').value;
  auth.signInWithEmailAndPassword(email, pass)
    .then(cred => {
      if(!cred.user.emailVerified){ showAuthMsg('Please verify your email first.'); auth.signOut(); }
    })
    .catch(err => showAuthMsg(err.message));
  return false;
}
function logout(){ auth.signOut(); }
auth.onAuthStateChanged(user => {
  const gate = document.getElementById('authGate');
  const app = document.getElementById('appContent');
  if (user && user.emailVerified) {
    gate.style.display = 'none';
    app.style.display = 'block';
    document.getElementById('userBadge').textContent = user.email;
    loadEverything();
  } else {
    gate.style.display = 'flex';
    app.style.display = 'none';
  }
});
</script>

<script>
let providers = [];
let providerRolesMap = {}; // provider_id -> [role,...]
let plantsList = [];
let allRates = [];
let currentProviderId = null;
let currentRateTab = 'us_freight';

const ROLE_LABELS = {carrier:'Carrier', freight_forwarder:'Freight Forwarder', customs_broker:'Customs Broker'};
const CUSTOMS_TYPES = [
  {value:'tramite_aduanal', label:'Trámite aduanal (customs processing)'},
  {value:'bodega_americana', label:'Bodega americana (US warehouse)'},
  {value:'lumper_fee', label:'Lumper fee'},
  {value:'inbond_release', label:'INBOND release'},
  {value:'customs', label:'Other / lump customs cost'},
];

async function loadEverything(){
  try {
    const [provRes, rolesRes, plantsRes, ratesRes] = await Promise.all([
      callApi('providers-search', {}),
      callApi('provider-roles-search', {}),
      callApi('plants-search', {}),
      callApi('provider-rates-search', {}),
    ]);
    providers = provRes.results || [];
    plantsList = plantsRes.results || [];
    allRates = ratesRes.results || [];
    providerRolesMap = {};
    (rolesRes.results || []).forEach(r => {
      if (!providerRolesMap[r.provider_id]) providerRolesMap[r.provider_id] = [];
      providerRolesMap[r.provider_id].push(r.role);
    });
    renderProviders();
  } catch (e) {
    document.getElementById('providerRows').innerHTML = `<div class="empty">Error loading from API: ${escapeHtml(e.message)}</div>`;
  }
}

// Customs agencies are a different relationship than carriers/forwarders — a customer works
// with their own agency on an ongoing basis (docs, load notices, appointments), not a one-off
// per-load booking like a carrier. Keeping them in a single mixed list made that easy to miss.
// A provider that's both a carrier and a customs broker shows up in both tabs.
let providerTab = 'carriers';
function setProviderTab(tab){
  providerTab = tab;
  document.getElementById('tabCarriersBtn').classList.toggle('active', tab === 'carriers');
  document.getElementById('tabAgenciesBtn').classList.toggle('active', tab === 'agencies');
  // Whatever Rates panel was open belongs to whichever provider you clicked before switching —
  // leaving it open while browsing the other category is exactly the "mixing everything" bug:
  // you'd see Customs Agencies in the list with a carrier's freight rates still showing below.
  closeRates();
  closeForm();
  renderProviders();
}

function renderProviders(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  const filtered = providers.filter(p => {
    const providerRoles = providerRolesMap[p.id] || [];
    const inTab = providerTab === 'agencies'
      ? providerRoles.includes('customs_broker')
      : providerRoles.some(r => r === 'carrier' || r === 'freight_forwarder');
    if (!inTab) return false;
    const roles = providerRoles.map(r => ROLE_LABELS[r] || r).join(' ').toLowerCase();
    return (p.name || '').toLowerCase().includes(q) ||
      (p.city || '').toLowerCase().includes(q) ||
      roles.includes(q);
  });
  const wrap = document.getElementById('providerRows');
  document.getElementById('emptyMsg').style.display = filtered.length ? 'none' : 'block';
  wrap.innerHTML = filtered.map(p => {
    const roles = providerRolesMap[p.id] || [];
    const city = [p.city, p.country].filter(Boolean).join(', ');
    return `<div class="pkg-row">
      <div class="pkg-plant-avatar">${escapeHtml((p.name || '?').trim().charAt(0).toUpperCase())}</div>
      <div class="pkg-plant-info">
        <a class="name-link pkg-plant-name" onclick="openRates('${p.id}')">${escapeHtml(p.name || '')}</a>
        <span class="pkg-plant-sub">${escapeHtml(city || '—')}${p.contact_name ? ' · ' + escapeHtml(p.contact_name) : ''}</span>
      </div>
      <div>${roles.map(r => `<span class="role-badge">${ROLE_LABELS[r] || r}</span>`).join('') || ''}</div>
      <div style="margin-left:auto;flex-shrink:0;white-space:nowrap;display:flex;gap:6px;">
        <button class="btn secondary small" onclick="editProvider('${p.id}')">Edit</button>
        <button class="btn danger" onclick="deleteProvider('${p.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function openForm(){
  closeRates();
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('formTitle').textContent = 'New provider';
  document.getElementById('providerId').value = '';
  ['p_name','p_country','p_city','p_phone','p_contact_name','p_email','p_email_cc','p_mc_number','p_dot_number','p_notes'].forEach(f => document.getElementById(f).value = '');
  document.querySelectorAll('.role-cb').forEach(cb => cb.checked = false);
  document.getElementById('formMsg').textContent = '';
  document.getElementById('formCard').scrollIntoView({behavior:'smooth'});
}

function editProvider(id){
  const p = providers.find(x => x.id === id);
  if (!p) return;
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('formTitle').textContent = 'Edit provider';
  document.getElementById('providerId').value = p.id;
  document.getElementById('p_name').value = p.name || '';
  document.getElementById('p_country').value = p.country || '';
  document.getElementById('p_city').value = p.city || '';
  document.getElementById('p_phone').value = p.phone || '';
  document.getElementById('p_contact_name').value = p.contact_name || '';
  document.getElementById('p_email').value = p.email || '';
  document.getElementById('p_email_cc').value = p.email_cc || '';
  document.getElementById('p_mc_number').value = p.mc_number || '';
  document.getElementById('p_dot_number').value = p.dot_number || '';
  document.getElementById('p_notes').value = p.notes || '';
  const roles = providerRolesMap[id] || [];
  document.querySelectorAll('.role-cb').forEach(cb => cb.checked = roles.includes(cb.value));
  document.getElementById('formMsg').textContent = '';
  document.getElementById('formCard').scrollIntoView({behavior:'smooth'});
}

function closeForm(){ document.getElementById('formCard').style.display = 'none'; }

// Calls providers-create/providers-update; on a real possible-duplicate response, shows what
// already exists and a real "Save anyway" action — never a silent override, never a generic
// OK/Cancel confirm(). Returns the API result on success, or null (already shown the message) on
// a duplicate that hasn't been confirmed yet or a hard error.
async function trySaveProvider(fn, payload){
  try {
    // Deterministic key — a genuine double-click/double-fire of this exact same save within the
    // same minute reuses the same key, so the API returns the row it already created instead of a
    // second one. A 409 possible_duplicate never inserts anything, so an override retry still
    // creates normally even though it computes the same key.
    const idempotencyKey = payload.idempotency_key || `${fn}|${JSON.stringify(payload)}|${new Date().toISOString().slice(0, 16)}`;
    return await callApi(fn, { ...payload, idempotency_key: idempotencyKey });
  } catch (e) {
    if (e.data && e.data.error === 'possible_duplicate'){
      const match = e.data.exact_match || (e.data.near_duplicate_names && e.data.near_duplicate_names[0]);
      document.getElementById('formMsg').innerHTML = `
        <div style="background:#FFF4E5;border:1px solid #F0C36D;border-radius:8px;padding:10px 12px;">
          ${escapeHtml(e.data.message)}${match ? `<br><strong>${escapeHtml(match.name)}</strong>` : ''}
          <div style="margin-top:8px;">
            <button type="button" class="btn small" onclick="saveProvider(true)">Save anyway — this is genuinely different</button>
          </div>
        </div>`;
      return null;
    }
    document.getElementById('formMsg').textContent = 'Error: ' + e.message;
    return null;
  }
}

async function saveProvider(forceOverride){
  const id = document.getElementById('providerId').value;
  const payload = {
    name: document.getElementById('p_name').value,
    country: document.getElementById('p_country').value || null,
    city: document.getElementById('p_city').value || null,
    phone: document.getElementById('p_phone').value || null,
    contact_name: document.getElementById('p_contact_name').value || null,
    email: document.getElementById('p_email').value || null,
    email_cc: document.getElementById('p_email_cc').value || null,
    mc_number: document.getElementById('p_mc_number').value || null,
    dot_number: document.getElementById('p_dot_number').value || null,
    notes: document.getElementById('p_notes').value || null,
  };
  if (!payload.name){
    document.getElementById('formMsg').textContent = 'Name is required.';
    return;
  }
  let providerId = id;
  try {
    if (id){
      const updated = await trySaveProvider('providers-update', { actor: currentActor(), id, ...payload, override_duplicate_check: !!forceOverride });
      if (!updated) return;
    } else {
      const created = await trySaveProvider('providers-create', { actor: currentActor(), ...payload, override_duplicate_check: !!forceOverride });
      if (!created) return;
      providerId = created.provider.id;
    }
    // Diff against the current roles instead of production's old delete-all-then-reinsert — fewer
    // writes, and a role that was never touched never gets a spurious delete+recreate.
    const selectedRoles = Array.from(document.querySelectorAll('.role-cb:checked')).map(cb => cb.value);
    const currentRoles = providerRolesMap[providerId] || [];
    const toAdd = selectedRoles.filter(r => !currentRoles.includes(r));
    const toRemove = currentRoles.filter(r => !selectedRoles.includes(r));
    for (const role of toAdd) await callApi('provider-roles-assign', { actor: currentActor(), provider_id: providerId, role });
    for (const role of toRemove) await callApi('provider-roles-remove', { actor: currentActor(), provider_id: providerId, role });
  } catch (e) {
    document.getElementById('formMsg').textContent = 'Error: ' + e.message;
    return;
  }
  closeForm();
  await loadEverything();
}

async function deleteProvider(id){
  if (!confirm('Delete this provider? This also deletes its roles and rates.')) return;
  try {
    await callApi('providers-delete', { actor: currentActor(), id });
  } catch (e) {
    alert('Error: ' + e.message);
    return;
  }
  if (currentProviderId === id) closeRates();
  await loadEverything();
}

// ============ RATES (spreadsheet-style, per provider) ============

// A provider only sees the tabs its own roles actually use — a pure carrier never had a reason
// to see a Customs & Fees tab (and vice versa for a pure customs agency), so showing all 3
// unconditionally was misleading even after the underlying data was already split correctly.
function ratesTabsForProvider(providerId){
  const roles = providerRolesMap[providerId] || [];
  const isFreight = roles.includes('carrier') || roles.includes('freight_forwarder');
  const isCustoms = roles.includes('customs_broker');
  return {
    us_freight: isFreight, mexican_freight: isFreight, customs: isCustoms,
  };
}

function openRates(providerId){
  closeForm();
  currentProviderId = providerId;
  const visible = ratesTabsForProvider(providerId);
  ['us_freight', 'mexican_freight', 'customs'].forEach(svc => {
    document.getElementById('rateTabBtn_' + svc).style.display = visible[svc] ? 'inline-block' : 'none';
  });
  currentRateTab = visible.us_freight ? 'us_freight' : (visible.mexican_freight ? 'mexican_freight' : 'customs');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.svc === currentRateTab));
  document.getElementById('loadRatesBtn').style.display = 'inline-block';
  const p = providers.find(x => x.id === providerId);
  document.getElementById('ratesTitle').textContent = (p ? p.name : '') + ' — Rates';
  document.getElementById('ratesCard').style.display = 'block';
  renderRateTable();
  document.getElementById('ratesCard').scrollIntoView({behavior:'smooth'});
}

function closeRates(){
  document.getElementById('ratesCard').style.display = 'none';
  currentProviderId = null;
}

function switchRateTab(svc){
  currentRateTab = svc;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.svc === svc));
  closeRateListPanel();
  document.getElementById('loadRatesBtn').style.display = 'inline-block';
  renderRateTable();
}

// ============ CARGAR PRECIOS (bulk paste, same pattern as plants.html's price-list intake) ============
// US Freight rate sheets arrive as an Excel export (Price, Ship Name, Ship City, Ship State columns)
// — pasted straight from Excel that comes through tab-separated, which is what this parses.
// Mexican Freight rate sheets arrive as a PDF (DESTINO / Currency / Dolares columns) — pasted as
// plain text, one "CITY USD $ 1,234.00" line per destination. Tested against real EBI Transfer
// rate sheets (Aug 2026) before shipping — both formats confirmed working against actual data.
let rateListRows = [];

function openRateListPanel(){
  const isUs = currentRateTab === 'us_freight';
  const isCustoms = currentRateTab === 'customs';
  document.getElementById('rateListHint').textContent = isUs
    ? 'Pega directo desde el Excel (columnas: Precio, Nombre, Ciudad, Estado) — una fila por línea. Nada se guarda hasta que revises y confirmes.'
    : isCustoms
    ? 'Pega la lista de costos tal como te la mandaron — una línea por costo, con su tipo y precio (ej. "Trámite aduanal: $400"). Nada se guarda hasta que revises y confirmes.'
    : 'Pega el texto del PDF tal como está — una línea por destino ("CIUDAD USD $ 1,234.00"). Nada se guarda hasta que revises y confirmes.';
  document.getElementById('rateListColHead').textContent = isUs ? 'Pickup location → Border' : isCustoms ? 'Tipo de costo' : 'Border → Destino';
  document.getElementById('rateListInput').value = '';
  document.getElementById('rateListReviewWrap').style.display = 'none';
  document.getElementById('rateListMsg').textContent = '';
  rateListRows = [];
  document.getElementById('rateListCard').style.display = 'block';
}

function closeRateListPanel(){
  document.getElementById('rateListCard').style.display = 'none';
}

function titleCaseWords(s){
  return (s || '').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

// Excel paste comes through as one tab-separated row per line: Price, Ship Name, Ship City, Ship
// State. Ship Name is only used to locate the city/state columns — not kept, per the user: just
// the pickup location and the price to the border, nothing else. Falls back to null (row dropped,
// never guessed) if it doesn't have all 4 fields.
function parseUsFreightLine(line){
  const parts = line.split('\t').map(s => s.trim()).filter(Boolean);
  if (parts.length < 4) return null;
  const price = parseFloat(parts[0].replace(/[$,]/g, ''));
  const [, , city, state] = parts;
  if (isNaN(price) || !city || !state) return null;
  return {
    origin: `${titleCaseWords(city)}, ${state.toUpperCase()}`,
    price,
  };
}

// PDF text comes through as "DESTINATION NAME  USD  $ 1,234.00" per line — destination kept
// exactly as written (existing rows are already uppercase, matching the source PDF's own case).
function parseMexicanFreightLine(line){
  const m = line.match(/^(.+?)\s+USD\s+\$\s*([\d,]+\.?\d*)/i);
  if (!m) return null;
  const destination = m[1].trim();
  const price = parseFloat(m[2].replace(/,/g, ''));
  if (!destination || isNaN(price)) return null;
  return { destination, price };
}

// Matches free text against the fixed CUSTOMS_TYPES list by keyword, not exact string — a real
// fee sheet writes these differently every time ("Trámite aduanal", "customs processing", "INBOND
// release fee"). Falls back to the first type (trámite_aduanal) with a flag so the trader picks
// the right one by hand in review rather than the row being silently dropped — customs costs are
// few enough per agency that a wrong guess is cheap to catch, an unlisted row isn't.
const CUSTOMS_KEYWORDS = [
  { value: 'tramite_aduanal', words: ['tramite aduanal', 'aduanal', 'customs processing', 'customs clearance'] },
  { value: 'bodega_americana', words: ['bodega americana', 'us warehouse', 'american warehouse'] },
  { value: 'lumper_fee', words: ['lumper'] },
  { value: 'inbond_release', words: ['inbond'] },
];
function guessCustomsType(line){
  const norm = line.toLowerCase();
  for (const k of CUSTOMS_KEYWORDS){
    if (k.words.some(w => norm.includes(w))) return k.value;
  }
  return null;
}
function parseCustomsLine(line){
  const m = line.match(/\$?\s*([\d,]+\.?\d*)\s*$/) || line.match(/\$\s*([\d,]+\.?\d*)/);
  if (!m) return null;
  const price = parseFloat(m[1].replace(/,/g, ''));
  if (isNaN(price)) return null;
  const serviceType = guessCustomsType(line) || 'tramite_aduanal';
  const unmatched = !guessCustomsType(line);
  return { serviceType, price, unmatched };
}

function processRateListText(){
  const text = document.getElementById('rateListInput').value;
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length){ document.getElementById('rateListMsg').textContent = 'Pega el texto primero.'; return; }

  const isUs = currentRateTab === 'us_freight';
  const isCustoms = currentRateTab === 'customs';
  rateListRows = [];
  for (const line of lines){
    const parsed = isCustoms ? parseCustomsLine(line) : (isUs ? parseUsFreightLine(line) : parseMexicanFreightLine(line));
    if (!parsed) continue; // not a data row (header, note, blank) — silently skipped, never guessed
    rateListRows.push({ raw: line, ...parsed });
  }
  renderRateListReview();
  document.getElementById('rateListMsg').textContent = rateListRows.length
    ? ''
    : 'No se reconoció ninguna fila válida en el texto pegado.';
}

function renderRateListReview(){
  const wrap = document.getElementById('rateListReviewWrap');
  const tbody = document.getElementById('rateListReviewRows');
  const isUs = currentRateTab === 'us_freight';
  const isCustoms = currentRateTab === 'customs';
  wrap.style.display = rateListRows.length ? 'block' : 'none';
  tbody.innerHTML = rateListRows.map((row, i) => {
    if (isCustoms){
      const typeOptions = CUSTOMS_TYPES.map(t => `<option value="${t.value}" ${row.serviceType === t.value ? 'selected' : ''}>${t.label}</option>`).join('');
      return `<tr${row.unmatched ? ' style="background:#FFF4E5;"' : ''}>
        <td><select style="width:100%;padding:5px 7px;border:1.5px solid var(--line);border-radius:5px;font-size:12.5px;" onchange="rateListRows[${i}].serviceType=this.value;rateListRows[${i}].unmatched=false;">${typeOptions}</select></td>
        <td><input type="number" step="0.01" value="${row.price}" style="width:100%;padding:5px 7px;border:1.5px solid var(--line);border-radius:5px;font-size:12.5px;" onchange="rateListRows[${i}].price=parseFloat(this.value)||0"></td>
      </tr>`;
    }
    const place = isUs ? row.origin : row.destination;
    return `<tr>
      <td><input type="text" value="${escapeHtml(place)}" style="width:100%;padding:5px 7px;border:1.5px solid var(--line);border-radius:5px;font-size:12.5px;" onchange="rateListRows[${i}].${isUs ? 'origin' : 'destination'}=this.value"></td>
      <td><input type="number" step="0.01" value="${row.price}" style="width:100%;padding:5px 7px;border:1.5px solid var(--line);border-radius:5px;font-size:12.5px;" onchange="rateListRows[${i}].price=parseFloat(this.value)||0"></td>
    </tr>`;
  }).join('');
}

async function applyRateList(){
  if (!currentProviderId || !rateListRows.length) return;
  const isUs = currentRateTab === 'us_freight';
  const isCustoms = currentRateTab === 'customs';
  document.getElementById('rateListMsg').textContent = 'Guardando…';
  let applied = 0, errors = 0;
  const failedRows = [];
  for (const row of rateListRows){
    const payload = isCustoms ? {
      actor: currentActor(),
      provider_id: currentProviderId,
      service_type: row.serviceType,
      origin: '',
      destination: '',
      rate: row.price,
    } : {
      actor: currentActor(),
      provider_id: currentProviderId,
      service_type: currentRateTab,
      origin: isUs ? row.origin : 'Border',
      destination: isUs ? '' : row.destination,
      rate: row.price,
    };
    // Same lane (provider+service+origin+destination) can already exist from a prior load —
    // provider-rates-set upserts on that exact key, updating the price instead of erroring (see
    // the Gadsden/AL multi-plant case).
    try {
      await callApi('provider-rates-set', payload);
      applied++;
    } catch (e) {
      errors++; failedRows.push(row);
    }
  }
  rateListRows = failedRows;
  renderRateListReview();
  document.getElementById('rateListMsg').textContent = `${applied} tarifa(s) guardada(s).${errors ? ' ' + errors + ' con error, quedaron arriba para reintentar.' : ''}`;
  if (!errors){
    closeRateListPanel();
  }
  await loadEverything();
  renderRateTable();
}

function ratesForCurrentTab(){
  if (currentRateTab === 'customs'){
    const customsTypeValues = CUSTOMS_TYPES.map(t => t.value);
    return allRates.filter(r => r.provider_id === currentProviderId && customsTypeValues.includes(r.service_type));
  }
  return allRates.filter(r => r.provider_id === currentProviderId && r.service_type === currentRateTab);
}

function renderRateTable(){
  const wrap = document.getElementById('rateTableWrap');
  const rows = ratesForCurrentTab();

  if (currentRateTab === 'customs'){
    wrap.innerHTML = `
      <table>
        <thead><tr><th>Type</th><th>Rate</th><th>Currency</th><th>Notes</th><th></th></tr></thead>
        <tbody id="rateRowsBody"></tbody>
      </table>
      <button class="btn secondary small" style="margin-top:10px;" onclick="addRateRow()">+ Add cost</button>`;
    const tbody = document.getElementById('rateRowsBody');
    tbody.innerHTML = '';
    rows.forEach(r => tbody.appendChild(buildCustomsRow(r)));
    if (!rows.length) tbody.innerHTML = '<tr><td colspan="5" class="empty">No costs yet.</td></tr>';
    return;
  }

  const isUs = currentRateTab === 'us_freight';
  wrap.innerHTML = `
    <table>
      <thead><tr><th>${isUs ? 'Origin' : 'Destination'}</th><th>Rate (USD)</th>${isUs ? '<th>Plant</th>' : ''}<th></th></tr></thead>
      <tbody id="rateRowsBody"></tbody>
    </table>
    <button class="btn secondary small" style="margin-top:10px;" onclick="addRateRow()">+ Add ${isUs ? 'origin' : 'destination'}</button>`;
  const tbody = document.getElementById('rateRowsBody');
  tbody.innerHTML = '';
  rows.forEach(r => tbody.appendChild(buildLaneRow(r, isUs)));
  if (!rows.length) tbody.innerHTML = `<tr><td colspan="${isUs?3:2}" class="empty">No rates yet.</td></tr>`;
}

// Plant is kept (US Freight only) — quotes.html looks up a plant's freight rate by this field
// when building a quote, so it drives real auto-fill logic, not just a label. Currency dropped:
// every rate loaded so far (both real EBI sheets) is USD, so the editable field was just an
// extra click that never changed anything — still stored as 'USD' on save, just not shown.
function buildLaneRow(r, isUs){
  const tr = document.createElement('tr');
  tr.dataset.id = r.id;
  const plantOptions = ['<option value="">—</option>'].concat(
    plantsList.map(p => `<option value="${p.id}" ${r.plant_id === p.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`)
  ).join('');
  tr.innerHTML = `
    <td><input class="rate-input" value="${escapeHtml(isUs ? r.origin : r.destination)}" onblur="saveRateField('${r.id}','${isUs ? 'origin' : 'destination'}',this.value,this)"></td>
    <td style="width:100px;"><input class="rate-input" type="number" step="0.01" value="${r.rate}" onblur="saveRateField('${r.id}','rate',parseFloat(this.value)||0,this)"></td>
    ${isUs ? `<td style="width:170px;"><select class="rate-input" onchange="saveRateField('${r.id}','plant_id',this.value||null,this)">${plantOptions}</select></td>` : ''}
    <td><button class="btn danger" onclick="deleteRate('${r.id}')">×</button></td>`;
  return tr;
}

function buildCustomsRow(r){
  const tr = document.createElement('tr');
  tr.dataset.id = r.id;
  const typeOptions = CUSTOMS_TYPES.map(t => `<option value="${t.value}" ${r.service_type === t.value ? 'selected' : ''}>${t.label}</option>`).join('');
  tr.innerHTML = `
    <td style="width:220px;"><select class="rate-input" onchange="saveRateField('${r.id}','service_type',this.value,this)">${typeOptions}</select></td>
    <td style="width:100px;"><input class="rate-input" type="number" step="0.01" value="${r.rate}" onblur="saveRateField('${r.id}','rate',parseFloat(this.value)||0,this)"></td>
    <td style="width:80px;"><input class="rate-input" value="${escapeHtml(r.currency || 'USD')}" onblur="saveRateField('${r.id}','currency',this.value,this)"></td>
    <td><input class="rate-input" value="${escapeHtml(r.notes || '')}" onblur="saveRateField('${r.id}','notes',this.value,this)"></td>
    <td><button class="btn danger" onclick="deleteRate('${r.id}')">×</button></td>`;
  return tr;
}

async function saveRateField(rateId, field, value, inputEl){
  const row = allRates.find(r => r.id === rateId);
  if (!row) return;
  if (row[field] === value) return;
  try {
    await callApi('provider-rates-update', { actor: currentActor(), id: rateId, [field]: value });
  } catch (e) {
    alert('Error saving: ' + e.message);
    return;
  }
  row[field] = value;
  if (inputEl){
    inputEl.style.borderColor = 'var(--green)';
    setTimeout(() => { inputEl.style.borderColor = ''; }, 700);
  }
}

async function addRateRow(){
  if (!currentProviderId) return;
  try {
    const created = await callApi('provider-rates-create', {
      actor: currentActor(),
      provider_id: currentProviderId,
      service_type: currentRateTab === 'customs' ? 'customs' : currentRateTab,
      origin: '', destination: '', rate: 0,
    });
    allRates.push(created.rate);
    renderRateTable();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function deleteRate(rateId){
  if (!confirm('Delete this rate?')) return;
  try {
    await callApi('provider-rates-delete', { actor: currentActor(), id: rateId });
  } catch (e) {
    alert('Error: ' + e.message);
    return;
  }
  allRates = allRates.filter(r => r.id !== rateId);
  renderRateTable();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
