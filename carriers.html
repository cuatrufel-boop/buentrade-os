<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuenTrade Trading OS — Freight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A2547; --navy-2:#0E3D8F; --blue:#1E6ADB; --blue-bright:#5AAAFF;
    --bg:#F4F7FB; --card:#FFFFFF; --line:#E2E9F2; --ink:#0F1F33; --ink-soft:#64748B; --red:#C4432E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px 40px;}
  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:14px 32px 12px;margin-bottom:24px;}
  .brand-word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:#fff;line-height:1;}
  .brand-word span{color:var(--blue-bright);}
  .top-row{display:flex;justify-content:space-between;align-items:center;}
  .nav-row{display:flex;align-items:center;gap:5px;margin-top:22px;}
  .nav-pill{display:inline-flex;align-items:center;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;letter-spacing:.2px;color:#fff;text-decoration:none;padding:7px 15px;border-radius:999px;transition:color .25s ease;white-space:nowrap;}
  .nav-pill.active{color:var(--blue-bright);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;}
  .btn.secondary{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red);padding:5px 10px;font-size:12px;}
  .wa-btn{display:inline-flex;align-items:center;gap:5px;background:#25D366;color:#fff;border:none;border-radius:7px;padding:5px 10px;font-weight:700;font-size:11.5px;cursor:pointer;white-space:nowrap;}
  .wa-btn:hover{background:#1EBE5A;}
  .wa-btn svg{width:12px;height:12px;flex-shrink:0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px;border-bottom:1.5px solid var(--line);}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:13.5px;font-family:inherit;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px;}
  .empty{color:var(--ink-soft);text-align:center;padding:24px;}
  .row-actions{display:flex;gap:6px;}
  #formCard{display:none;}
  #searchBox{width:100%;max-width:420px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  .name-link{color:var(--blue);font-weight:600;text-decoration:none;cursor:pointer;}
  .name-link:hover{text-decoration:underline;}
  .view-label{display:block;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px;}
</style>
</head>
<body>

<!-- ============ LOGIN GATE ============ -->
<style>
  #authGate{position:fixed;inset:0;background:linear-gradient(135deg,#0B2545 0%,#123A6B 100%);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;}
  .auth-box{background:#fff;border-radius:16px;width:100%;max-width:380px;padding:32px 30px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;}
  .auth-logo .word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:#0B2545;}
  .auth-logo .word span{color:#1B6FC9;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:12px;font-weight:600;color:#5B6B82;margin-bottom:5px;}
  .auth-field input{width:100%;padding:10px 12px;border:1.5px solid #E1E6ED;border-radius:8px;font-size:14px;font-family:inherit;}
  .auth-submit{width:100%;padding:11px;border:none;border-radius:8px;background:#1B6FC9;color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;}
  .auth-msg{font-size:12.5px;margin-top:12px;padding:9px 11px;border-radius:8px;line-height:1.4;display:none;}
  .auth-msg.err{background:#FCEBE7;color:#B23A22;display:block;}
  .auth-note{font-size:11px;color:#9AABC2;text-align:center;margin-top:16px;line-height:1.5;}
</style>
<div id="authGate">

      <div class="word">Buen<span>Trade</span> Trading OS</div>
    </div>
    <form id="formSignIn" onsubmit="return doSignIn(event)">
      <div class="auth-field"><label>Work email</label><input type="email" id="siEmail" required></div>
      <div class="auth-field"><label>Password</label><input type="password" id="siPass" required></div>
      <button class="auth-submit" type="submit">Sign In</button>

    <div id="authMsg" class="auth-msg"></div>
    <div class="auth-note">Accounts are created from the Trading Tool. Same login works here.</div>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyApz__ZGeVwgt1ObJYCQ6elVa9KXFZA3tM",
  authDomain: "buentrade-fc841.firebaseapp.com",
  projectId: "buentrade-fc841",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const SUPABASE_URL = "https://zhtvimnaeogywmjuomiz.supabase.co";
const SUPABASE_KEY = "sb_publishable_bcyFUZhQKaYTFDLxzJh2qw_yBWgBAEu";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  accessToken: async () => {
    const user = auth.currentUser;
    return user ? await user.getIdToken(true) : null;
  }
});

function showAuthMsg(text){
  const el = document.getElementById('authMsg');
  el.textContent = text;
  el.className = 'auth-msg err';
}
function doSignIn(e){
  e.preventDefault();
  const email = document.getElementById('siEmail').value;
  const pass = document.getElementById('siPass').value;
  auth.signInWithEmailAndPassword(email, pass)
    .then(cred => {
      if(!cred.user.emailVerified){ showAuthMsg('Please verify your email first.'); auth.signOut(); }
    })
    .catch(err => showAuthMsg(err.message));
  return false;
}
function logout(){ auth.signOut(); }
auth.onAuthStateChanged(user => {
  const gate = document.getElementById('authGate');
  const app = document.getElementById('appContent');
  if (user && user.emailVerified) {
    gate.style.display = 'none';
    app.style.display = 'block';
    document.getElementById('userBadge').textContent = user.email;
    loadCarriers();
  } else {
    gate.style.display = 'flex';
    app.style.display = 'none';
  }
});
</script>

<div class="wrap">
  <h1>Freight</h1>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
      <input type="text" id="searchBox" placeholder="Search by name, city, or contact..." oninput="renderCarriers()">
      <button class="btn" onclick="openForm()">+ Add Carrier</button>
    </div>
  </div>

  <div class="card" id="formCard">
    <strong id="formTitle">New carrier</strong>
    <input type="hidden" id="carrierId">
    <div class="grid2" style="margin-top:14px;">
      <div class="field"><label>Name *</label><input id="name" required></div>
      <div class="field"><label>Country</label><input id="country"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>City</label><input id="city"></div>

      <div style="display:flex;gap:8px;">
        <button class="btn secondary" onclick="editFromView()">Edit</button>
        <button class="btn danger" onclick="deleteFromView()">Delete</button>
      </div>

      <div><label class="view-label">Location</label><span id="v_location">—</span></div>

      <div><label class="view-label">Email</label><span id="v_email">—</span></div>
      <div><label class="view-label">Phone</label><button class="wa-btn" id="v_waBtn" style="display:none;" onclick="openViewWhatsApp()"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.22 8.22 0 0 1-1.26-4.4c0-4.55 3.7-8.25 8.26-8.25 2.2 0 4.27.86 5.83 2.42a8.2 8.2 0 0 1 2.42 5.84c0 4.55-3.71 8.25-8.26 8.25zm4.52-6.18c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.78.97-.15.16-.29.18-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.16.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43-.14-.01-.31-.01-.47-.01-.16 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.16 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.07-.1-.23-.16-.48-.28z"/></svg></button></div>
    </div>
    <div style="margin-top:10px;"><label class="view-label">Notes</label><span id="v_notes">—</span></div>

  <div class="card">
    <table>
      <thead><tr><th>Name</th><th>City</th><th>Contact Name</th><th>Phone</th></tr></thead>
      <tbody id="carrierRows"></tbody>
    </table>
    <div id="emptyMsg" class="empty" style="display:none;">No carriers found.</div>

</div>

<script>
let carriers = [];

async function loadCarriers(){
  const { data, error } = await db.from('freight_carriers').select('*').order('name');
  if (error){
    document.getElementById('emptyMsg').style.display = 'block';
    document.getElementById('emptyMsg').textContent = 'Error loading carriers: ' + error.message;
    return;
  }
  carriers = data || [];
  renderCarriers();
}

function renderCarriers(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  const filtered = carriers.filter(c =>
    (c.name || '').toLowerCase().includes(q) ||
    (c.city || '').toLowerCase().includes(q) ||
    (c.contact_name || '').toLowerCase().includes(q)
  );
  const tbody = document.getElementById('carrierRows');
  tbody.innerHTML = '';
  document.getElementById('emptyMsg').style.display = filtered.length ? 'none' : 'block';
  document.getElementById('emptyMsg').textContent = 'No carriers found.';
  filtered.forEach(c => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a class="name-link" onclick="viewCarrier('${c.id}')">${escapeHtml(c.name || '')}</a></td>
      <td>${escapeHtml(c.city || '—')}</td>
      <td>${c.contact_name && c.email ? `<a href="mailto:${escapeHtml(c.email)}" style="color:var(--blue);text-decoration:none;">${escapeHtml(c.contact_name)}</a>` : escapeHtml(c.contact_name || '—')}</td>
      <td>${c.phone ? `<a class="wa-btn" href="https://wa.me/${escapeHtml(c.phone.replace(/\D/g,''))}" target="_blank" rel="noopener" title="${escapeHtml(c.phone)}"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.22 8.22 0 0 1-1.26-4.4c0-4.55 3.7-8.25 8.26-8.25 2.2 0 4.27.86 5.83 2.42a8.2 8.2 0 0 1 2.42 5.84c0 4.55-3.71 8.25-8.26 8.25zm4.52-6.18c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.78.97-.15.16-.29.18-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.16.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43-.14-.01-.31-.01-.47-.01-.16 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.16 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.07-.1-.23-.16-.48-.28z"/></svg></a>` : '—'}</td>`;
    tbody.appendChild(tr);
  });
}

function openForm(){
  document.getElementById('viewCard').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('formTitle').textContent = 'New carrier';
  ['carrierId','name','country','city','phone','contact_name','email','notes'].forEach(f => document.getElementById(f).value = '');
  document.getElementById('formMsg').textContent = '';
  document.getElementById('formCard').scrollIntoView({behavior:'smooth'});
}

function editCarrier(id){
  const c = carriers.find(x => x.id === id);
  if (!c) return;
  document.getElementById('viewCard').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('formTitle').textContent = 'Edit carrier';
  document.getElementById('carrierId').value = c.id;
  ['name','country','city','phone','contact_name','email','notes'].forEach(f => {
    document.getElementById(f).value = c[f] || '';
  });
  document.getElementById('formMsg').textContent = '';
  document.getElementById('formCard').scrollIntoView({behavior:'smooth'});
}

function closeForm(){ document.getElementById('formCard').style.display = 'none'; }

let viewingCarrierId = null;

function viewCarrier(id){
  const viewCard = document.getElementById('viewCard');
  if (viewingCarrierId === id && viewCard.style.display === 'block'){
    viewCard.style.display = 'none';
    viewingCarrierId = null;
    return;
  }
  const c = carriers.find(x => x.id === id);
  if (!c) return;
  viewingCarrierId = id;
  document.getElementById('formCard').style.display = 'none';
  viewCard.style.display = 'block';
  document.getElementById('viewTitle').textContent = c.name || '';
  document.getElementById('v_location').textContent = [c.city, c.country].filter(Boolean).join(', ') || '—';
  document.getElementById('v_contact_name').innerHTML = (c.contact_name && c.email) ? `<a href="mailto:${escapeHtml(c.email)}" style="color:var(--blue);text-decoration:none;">${escapeHtml(c.contact_name)}</a>` : escapeHtml(c.contact_name || '—');
  document.getElementById('v_email').innerHTML = c.email ? `<a href="mailto:${escapeHtml(c.email)}" style="color:var(--blue);text-decoration:none;">${escapeHtml(c.email)}</a>` : '—';
  document.getElementById('v_notes').textContent = c.notes || '—';
  const waBtn = document.getElementById('v_waBtn');
  if (c.phone){ waBtn.style.display = 'inline-flex'; waBtn.dataset.number = c.phone; }
  else { waBtn.style.display = 'none'; waBtn.dataset.number = ''; }
  document.getElementById('viewCard').scrollIntoView({behavior:'smooth'});
}

function editFromView(){
  editCarrier(viewingCarrierId);
}

function deleteFromView(){
  if (viewingCarrierId) deleteCarrier(viewingCarrierId);
}

function openViewWhatsApp(){
  const raw = document.getElementById('v_waBtn').dataset.number || '';
  const digits = raw.replace(/\D/g, '');
  if (!digits) return;
  window.open('https://wa.me/' + digits, '_blank');
}

async function saveCarrier(){
  const id = document.getElementById('carrierId').value;
  const payload = {
    name: document.getElementById('name').value,
    country: document.getElementById('country').value || null,
    city: document.getElementById('city').value || null,
    phone: document.getElementById('phone').value || null,
    contact_name: document.getElementById('contact_name').value || null,
    email: document.getElementById('email').value || null,
    notes: document.getElementById('notes').value || null,
  };
  if (!payload.name){
    document.getElementById('formMsg').textContent = 'Name is required.';
    return;
  }
  if (payload.phone && !payload.phone.trim().startsWith('+')){
    document.getElementById('formMsg').textContent = 'Phone must include the country code, e.g. +52 6621234567.';
    return;
  }
  const { error } = id
    ? await db.from('freight_carriers').update(payload).eq('id', id)
    : await db.from('freight_carriers').insert(payload);
  if (error){
    document.getElementById('formMsg').textContent = 'Error: ' + error.message;
    return;
  }
  closeForm();
  await loadCarriers();
}

async function deleteCarrier(id){
  if (!confirm('Delete this carrier?')) return;
  const { error } = await db.from('freight_carriers').delete().eq('id', id);
  if (error){ alert('Error: ' + error.message); return; }
  document.getElementById('viewCard').style.display = 'none';
  await loadCarriers();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
