<script>
const firebaseConfig = {
  apiKey: "AIzaSyApz__ZGeVwgt1ObJYCQ6elVa9KXFZA3tM",
  authDomain: "buentrade-fc841.firebaseapp.com",
  projectId: "buentrade-fc841",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

// STAGING Trading OS API — every read/write goes through an Edge Function (here: `messaging`).
const API_ROOT = 'https://geqhjykbxvxugvnpnygn.supabase.co/functions/v1/';
const API_KEY = 'sb_publishable_p7na-oT05z2cPHXdzgzD6Q_Y29Hv3pe';

async function callApi(fn, body){
  const res = await fetch(API_ROOT + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY, 'apikey': API_KEY },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.message || data.error || res.status); err.data = data; throw err; }
  return data;
}
function currentActor(){ return (auth.currentUser && auth.currentUser.email) || 'unknown'; }

function showAuthMsg(text){
  const el = document.getElementById('authMsg');
  el.textContent = text;
  el.className = 'auth-msg err';
}
function doSignIn(e){
  e.preventDefault();
  auth.signInWithEmailAndPassword(document.getElementById('siEmail').value, document.getElementById('siPass').value)
    .then(cred => { if(!cred.user.emailVerified){ showAuthMsg('Please verify your email first.'); auth.signOut(); } })
    .catch(err => showAuthMsg(err.message));
  return false;
}
function logout(){ auth.signOut(); }

// Load once per tab — Firebase refires onAuthStateChanged on silent token refreshes (same guard as every page).
let btAuthLoaded = false;
auth.onAuthStateChanged(user => {
  const gate = document.getElementById('authGate');
  const app = document.getElementById('appContent');
  if (user && user.emailVerified) {
    gate.style.display = 'none';
    app.style.display = 'block';
    document.getElementById('userBadge').textContent = user.email;
    if (!btAuthLoaded) { btAuthLoaded = true; loadMessaging(); }
  } else {
    gate.style.display = 'flex';
    app.style.display = 'none';
  }
});
</script>

<script>
// ============ MESSAGING (approved 2026-09-27) ============
// Per client: every real reason to write today, each already written in the trader's own style. The trader picks one,
// edits it if he wants and sends it — nothing is ever sent automatically. See supabase/functions/messaging.
const KIND_LABEL = { cycle: 'Buying cycle', ask_volume: 'Ask volume', personal: 'Personal', market: 'Market' };
const KIND_BADGE = { cycle: 'due', ask_volume: 'soft', personal: 'hot', market: 'active' };
const FROM_ALIAS = 'offers';
const FROM_DISPLAY = 'Offers BuenTrade <offers@buentradegroup.com>';
let msgData = { clients: [], business_types: [], bulletin: null };
const msgSel = {};        // clientId -> selected reason_key
const msgText = {};       // `${clientId}|${reason_key}` -> text currently in the box (keeps edits across re-renders)
const msgSrcOpen = {};    // clientId -> source line open
const msgShowAll = {};    // clientId -> show every product
const msgDrafting = new Set();

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayKey(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function hhmm(ts){ const d = new Date(ts); return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

async function loadMessaging(){
  try {
    msgData = await callApi('messaging', { action: 'list', actor: currentActor() });
  } catch (e){
    document.getElementById('msgList').innerHTML = `<div class="empty">Couldn't load Messaging: ${esc(e.message)}</div>`;
    return;
  }
  for (const c of msgData.clients){
    const pending = c.options.filter(o => !o.sent_at);
    if (!msgSel[c.id] || !c.options.some(o => o.reason_key === msgSel[c.id])) msgSel[c.id] = (pending[0] || c.options[0] || {}).reason_key || null;
  }
  renderAll();
  fetchMissingDrafts();
}

function clientOption(c, key){ return c.options.find(o => o.reason_key === key) || null; }

function renderAll(){
  const b = msgData.bulletin;
  document.getElementById('msgNotice').innerHTML = b && !b.fresh
    ? `<div class="notice">Market Flash: the latest bulletin (${esc(String(b.as_of).slice(0,10))}) is older than 21 days, so there are no market messages today. They come back as soon as a new bulletin arrives.</div>`
    : (!b ? `<div class="notice">Market Flash: no bulletin yet — market messages will appear once one arrives.</div>` : '');
  const sort = document.getElementById('msgSort').value;
  const list = msgData.clients.filter(c => c.options.length).sort((a, c2) =>
    sort === 'az' ? a.trade_name.trim().localeCompare(c2.trade_name.trim())
    : sort === 'month' ? (c2.uncovered - a.uncovered) || (c2.score - a.score)
    : (c2.score - a.score) || a.trade_name.trim().localeCompare(c2.trade_name.trim()));
  let pending = 0, sent = 0;
  msgData.clients.forEach(c => c.options.forEach(o => o.sent_at ? sent++ : pending++));
  document.getElementById('cPending').textContent = `${pending} pending`;
  document.getElementById('cSent').textContent = `${sent} sent today`;
  const asked = msgData.clients.reduce((n, c) => n + (c.asked_today || 0), 0);
  document.getElementById('cAsked').style.display = asked ? '' : 'none';
  document.getElementById('cAsked').textContent = `${asked} asked for product`;
  document.getElementById('msgList').innerHTML = list.length ? list.map(clientCardHtml).join('') : '<div class="empty">Nothing to tell any client today.</div>';
  document.querySelectorAll('#msgList select, .toolbar select').forEach(s => { if (typeof btEnhanceSelect === 'function') btEnhanceSelect(s); });
}

function clientCardHtml(c){
  const key = msgSel[c.id];
  const o = clientOption(c, key);
  const sentCount = c.options.filter(x => x.sent_at).length;
  const place = [c.city, c.state].filter(Boolean).join(', ');
  const products = msgShowAll[c.id] ? c.products : c.products.slice(0, 6);
  const bizOpts = `<option value="">— Business type —</option>` + msgData.business_types.map(b => `<option value="${b.id}" data-sub="${esc(b.name_es || '')}" ${b.id === c.business_type_id ? 'selected' : ''}>${esc(b.name_en)}</option>`).join('');
  const worksHtml = c.works.length
    ? c.works.map(w => `<div>${esc(KIND_LABEL[w.kind] || w.kind)} · <b>${w.requests} of ${w.sent}</b> led to a request</div>`).join('')
    : '<div class="muted">Learning — nothing sent yet</div>';
  return `<div class="card" id="cl_${c.id}"><div class="cl-body">
    <div class="who">
      <div class="name">${esc(c.trade_name.trim())}</div>
      <div class="meta">${esc([c.first_name && c.contact_name ? c.contact_name : '', place].filter(Boolean).join(' · '))}</div>
      <div class="sec-l">Business</div>
      <select onchange="msgSetBusiness('${c.id}', this.value)" ${msgData.business_types.length ? '' : 'disabled'}>${msgData.business_types.length ? bizOpts : '<option value="">No business types yet</option>'}</select>
      <div class="sec-l">Loads / month (all suppliers)</div>
      ${products.map(p => `<div class="cons-row">
          <span class="pn ${p.cadence ? '' : 'missing'}">${esc(p.name_en)}</span>
          <input type="number" min="1" step="1" value="${p.monthly_input ?? ''}" placeholder="?" title="Loads a month, from all suppliers" onchange="msgSetLoads('${c.id}','${p.link_id}', this.value)">
          <span class="cov">${p.cadence ? `${esc(p.cadence)} · from us this month: ${p.from_us_month}` : 'Unknown'}</span>
        </div>`).join('')}
      ${c.products.length > 6 ? `<button class="link-btn" onclick="msgShowAll['${c.id}']=!msgShowAll['${c.id}'];renderAll()">${msgShowAll[c.id] ? 'Show fewer' : `Show all ${c.products.length}`}</button>` : ''}
      <div class="sec-l">What they told you</div>
      ${c.notes.length ? c.notes.map(n => `<div class="note-item"><span style="flex:1;">${esc(n.note)} <span class="muted">· ${esc(String(n.created_at).slice(0,10))}</span></span><button class="x" title="Delete note" onclick="msgDeleteNote('${n.id}')">✕</button></div>`).join('') : '<div class="muted" style="font-size:12px;">Nothing yet</div>'}
      <div class="note-add"><input id="note_${c.id}" placeholder="e.g. building a new plant" onkeydown="if(event.key==='Enter')msgAddNote('${c.id}')"><button class="btn small" onclick="msgAddNote('${c.id}')">Save</button></div>
      <div class="sec-l">What works</div>
      <div class="works">${worksHtml}</div>
    </div>
    <div>
      <div class="cl-head"><span>${c.options.length} thing${c.options.length === 1 ? '' : 's'} to tell ${esc(c.first_name || c.trade_name.trim())} · pick one</span>
        <span><span class="badge active">${c.options.length - sentCount} pending</span> <span class="badge ok">${sentCount} sent</span></span></div>
      <div class="opts">${c.options.map(x => `
        <div class="opt ${x.reason_key === key ? 'sel' : ''} ${x.sent_at ? 'done' : ''}" onclick="msgPick('${c.id}', '${esc(x.reason_key)}')">
          <span class="badge ${KIND_BADGE[x.kind]}">${KIND_LABEL[x.kind]}</span>
          <span class="why">${x.is_new && !x.sent_at ? '<span class="newdot"></span>' : ''}${esc(x.why)}</span>
          ${x.sent_at ? `<span class="badge ok">Sent ${hhmm(x.sent_at)}</span>` : '<span class="badge soft">Pending</span>'}
        </div>`).join('')}</div>
      ${o ? draftHtml(c, o) : ''}
    </div>
  </div></div>`;
}

function draftHtml(c, o){
  const tk = `${c.id}|${o.reason_key}`;
  const sent = !!o.sent_at;
  const text = sent ? o.sent_message : (msgText[tk] ?? o.draft ?? '');
  const writing = !sent && o.draft == null;
  const edited = !sent && o.draft != null && msgText[tk] != null && msgText[tk].trim() !== o.draft.trim();
  const noPhone = !c.phone, noEmail = !c.email;
  return `<div class="draft">
    <button class="link-btn" onclick="msgSrcOpen['${c.id}']=!msgSrcOpen['${c.id}'];renderAll()">Where does this come from?</button>
    ${msgSrcOpen[c.id] ? `<div class="src">${esc(o.source)}</div>` : ''}
    <textarea class="msg" id="msg_${c.id}" ${sent || writing ? 'disabled' : ''} placeholder="${writing ? 'Writing…' : ''}" oninput="msgText['${tk}']=this.value;msgMarkEdited('${c.id}')">${esc(writing ? '' : text)}</textarea>
    <div class="draft-foot">
      <span class="hint ${edited ? 'edited' : ''}" id="hint_${c.id}">${sent ? `Sent by ${o.sent_channel === 'email' ? 'email' : 'WhatsApp'} at ${hhmm(o.sent_at)}` : edited ? 'Edited — your version teaches the system how you write' : 'Written in your style — edit anything before sending'}</span>
      ${sent ? '' : `<button class="btn small" onclick="msgRewrite('${c.id}')" ${writing ? 'disabled' : ''}>Rewrite</button>
      <button class="btn" onclick="msgSendWhatsApp('${c.id}')" ${writing || noPhone ? 'disabled' : ''} title="${noPhone ? 'No WhatsApp or phone on file' : 'Opens WhatsApp with this text'}">WhatsApp</button>
      <button class="btn secondary" onclick="msgSendEmail('${c.id}')" ${writing || noEmail ? 'disabled' : ''} title="${noEmail ? 'No email on file' : 'Review and send by email'}">Email</button>`}
    </div>
  </div>`;
}

function msgMarkEdited(cid){
  const c = msgData.clients.find(x => x.id === cid); const o = c && clientOption(c, msgSel[cid]);
  const el = document.getElementById('hint_' + cid);
  if (!o || !el) return;
  const t = msgText[`${cid}|${o.reason_key}`];
  const edited = o.draft != null && t != null && t.trim() !== o.draft.trim();
  el.className = 'hint' + (edited ? ' edited' : '');
  el.textContent = edited ? 'Edited — your version teaches the system how you write' : 'Written in your style — edit anything before sending';
}

function msgPick(cid, key){ msgSel[cid] = key; renderAll(); fetchMissingDrafts(); }

// Drafts are written on demand for the option each client has selected (4 at a time), and kept for the day.
async function fetchMissingDrafts(){
  const queue = msgData.clients.map(c => [c, clientOption(c, msgSel[c.id])]).filter(([c, o]) => o && !o.sent_at && o.draft == null && !msgDrafting.has(`${c.id}|${o.reason_key}`));
  let i = 0;
  async function worker(){
    while (i < queue.length){
      const [c, o] = queue[i++];
      const tk = `${c.id}|${o.reason_key}`;
      msgDrafting.add(tk);
      try {
        const d = await callApi('messaging', { action: 'draft', actor: currentActor(), customer_id: c.id, reason_key: o.reason_key });
        o.draft = d.message; o.subject = d.subject;
      } catch (e){
        o.draft = ''; o.subject = '';
        console.error('draft failed', e);
      } finally { msgDrafting.delete(tk); }
      if (msgSel[c.id] === o.reason_key) rerenderClient(c.id);
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
}
function rerenderClient(cid){
  const el = document.getElementById('cl_' + cid);
  const c = msgData.clients.find(x => x.id === cid);
  if (!el || !c) return;
  const focused = document.activeElement && el.contains(document.activeElement) ? document.activeElement.id : null;
  el.outerHTML = clientCardHtml(c);
  document.querySelectorAll(`#cl_${cid} select`).forEach(s => btEnhanceSelect(s));
  if (focused && document.getElementById(focused)) document.getElementById(focused).focus();
}

async function msgRewrite(cid){
  const c = msgData.clients.find(x => x.id === cid); const o = c && clientOption(c, msgSel[cid]);
  if (!o) return;
  o.draft = null; delete msgText[`${cid}|${o.reason_key}`];
  rerenderClient(cid);
  try {
    const d = await callApi('messaging', { action: 'draft', actor: currentActor(), customer_id: cid, reason_key: o.reason_key, regenerate: true });
    o.draft = d.message; o.subject = d.subject;
  } catch (e){ o.draft = ''; await btAlert(`Couldn't rewrite: ${e.message}`); }
  rerenderClient(cid);
}

function currentMessage(cid){
  const box = document.getElementById('msg_' + cid);
  return box ? box.value.trim() : '';
}
async function logSend(c, o, message, channel){
  const r = await callApi('messaging', {
    action: 'send', actor: currentActor(), customer_id: c.id, reason_key: o.reason_key, product_id: o.product_id,
    message, draft: o.draft, channel, idempotency_key: `messaging|${c.id}|${o.reason_key}|${todayKey()}|${channel}`,
  });
  o.sent_at = r.message.sent_at; o.sent_channel = channel; o.sent_message = r.message.message;
  const next = c.options.find(x => !x.sent_at);
  if (next) msgSel[c.id] = next.reason_key;
  renderAll();
  fetchMissingDrafts();
}

// WhatsApp can only be pre-filled, never sent for the trader: this opens the chat with the text (on the click itself,
// so the browser doesn't block it) and records it as sent — same rule as every other WhatsApp button in the app.
async function msgSendWhatsApp(cid){
  const c = msgData.clients.find(x => x.id === cid); const o = c && clientOption(c, msgSel[cid]);
  const message = currentMessage(cid);
  if (!o || !message || !c.phone) return;
  bcConfirmWaSend(c.phone, message, null);
  try { await logSend(c, o, message, 'whatsapp'); } catch (e){ await btAlert(`WhatsApp opened, but it couldn't be recorded: ${e.message}`); }
}
async function msgSendEmail(cid){
  const c = msgData.clients.find(x => x.id === cid); const o = c && clientOption(c, msgSel[cid]);
  const message = currentMessage(cid);
  if (!o || !message || !c.email) return;
  try {
    await bcSendEmailApi({ fromAlias: FROM_ALIAS, fromDisplay: FROM_DISPLAY, to: c.email, subject: o.subject || '', text: message });
  } catch (e){
    if (e.cancelled) return;
    await btAlert(`Email not sent: ${e.message}`); return;
  }
  const finalText = (document.getElementById('emailModalBody') || {}).value || message;
  try { await logSend(c, o, finalText.trim(), 'email'); } catch (e){ await btAlert(`Email sent, but it couldn't be recorded: ${e.message}`); }
}

async function msgAddNote(cid){
  const input = document.getElementById('note_' + cid);
  const note = input ? input.value.trim() : '';
  if (!note) return;
  input.disabled = true;
  try {
    const r = await callApi('messaging', { action: 'add_note', actor: currentActor(), customer_id: cid, note, idempotency_key: `note|${cid}|${note}|${todayKey()}` });
    if (r.note) msgSel[cid] = `note:${r.note.id}`; // what they just told you is what you'll most likely want to write about
    await loadMessaging();
  } catch (e){ input.disabled = false; await btAlert(`Couldn't save the note: ${e.message}`); }
}
async function msgDeleteNote(id){
  try { await callApi('messaging', { action: 'delete_note', actor: currentActor(), id }); await loadMessaging(); }
  catch (e){ await btAlert(`Couldn't delete the note: ${e.message}`); }
}
async function msgSetBusiness(cid, value){
  try { await callApi('messaging', { action: 'set_business_type', actor: currentActor(), customer_id: cid, business_type_id: value || null }); const c = msgData.clients.find(x => x.id === cid); if (c) c.business_type_id = value || null; }
  catch (e){ await btAlert(`Couldn't save: ${e.message}`); }
}
async function msgSetLoads(cid, linkId, value){
  const v = String(value).trim();
  if (v && !(Number(v) > 0 && Number.isInteger(Number(v)))){ await btAlert('Loads a month must be a whole number (or empty).'); return; }
  try { await callApi('messaging', { action: 'set_loads', actor: currentActor(), link_id: linkId, loads_month: v === '' ? null : Number(v) }); await loadMessaging(); }
  catch (e){ await btAlert(`Couldn't save: ${e.message}`); }
}

// BuenTrade dropdown — same generic <select> enhancer every page with a dropdown uses, copied verbatim.
function btEnhanceSelect(selectEl){
  if (!selectEl || selectEl.dataset.btEnhanced) return;
  selectEl.dataset.btEnhanced = '1';
  const savedStyle = selectEl.getAttribute('style') || '';
  selectEl.removeAttribute('style');

  const wrap = document.createElement('div');
  wrap.className = 'bt-select-wrap';
  if (savedStyle) wrap.setAttribute('style', savedStyle);
  selectEl.parentNode.insertBefore(wrap, selectEl);
  wrap.appendChild(selectEl);
  selectEl.style.display = 'none';

  wrap.insertAdjacentHTML('afterbegin', `
    <button type="button" class="bt-select-trigger">
      <span class="bt-select-label"></span>
      <svg class="bt-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="bt-select-panel" style="display:none;"></div>`);
  const trigger = wrap.querySelector('.bt-select-trigger');
  const label = wrap.querySelector('.bt-select-label');
  const panel = wrap.querySelector('.bt-select-panel');
  if (selectEl.disabled) trigger.disabled = true;

  const escBt = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  let searchTerm = '';

  function renderPanel(){
    const opts = [...selectEl.options];
    const showSearch = opts.length > 8;
    const q = searchTerm.trim().toLowerCase();
    const filtered = q ? opts.filter(o => o.textContent.toLowerCase().includes(q)) : opts;
    panel.innerHTML = (showSearch ? `<input type="text" class="bt-select-search" placeholder="Search…" value="${escBt(searchTerm)}">` : '')
      + (filtered.length ? filtered.map(o => `
          <button type="button" class="bt-select-option${o.value === selectEl.value ? ' selected' : ''}" data-value="${escBt(o.value)}">
            <svg class="bt-select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>${o.dataset.sub ? `<span class="bt-select-two"><span>${escBt(o.textContent)}</span><span class="bt-select-sub">${escBt(o.dataset.sub)}</span></span>` : escBt(o.textContent)}
          </button>`).join('')
        : `<div class="bt-select-empty">No matches</div>`);
    panel.querySelectorAll('.bt-select-option').forEach(btn => {
      btn.onclick = () => {
        selectEl.value = btn.dataset.value;
        selectEl.dispatchEvent(new Event('change', { bubbles: true }));
        searchTerm = '';
        close();
        sync();
      };
    });
    const search = panel.querySelector('.bt-select-search');
    if (search){
      search.addEventListener('click', e => e.stopPropagation());
      search.addEventListener('input', () => {
        searchTerm = search.value;
        const pos = search.selectionStart;
        renderPanel();
        const ns = panel.querySelector('.bt-select-search');
        if (ns){ ns.focus(); ns.setSelectionRange(pos, pos); }
      });
    }
  }
  function sync(){
    const opt = selectEl.options[selectEl.selectedIndex];
    label.textContent = opt ? opt.textContent : '';
  }
  function open(){ searchTerm = ''; renderPanel(); panel.style.display = 'block'; wrap.classList.add('open'); const s = panel.querySelector('.bt-select-search'); if (s) s.focus(); }
  function close(){ panel.style.display = 'none'; wrap.classList.remove('open'); }
  trigger.onclick = e => { e.stopPropagation(); if (selectEl.disabled) return; panel.style.display === 'none' ? open() : close(); };
  document.addEventListener('click', e => { if (!wrap.contains(e.target)) close(); });
  new MutationObserver(sync).observe(selectEl, { childList: true, subtree: true });
  // Real bug found live 2026-09-18 (products.html/plants.html): the MutationObserver above only
  // catches <option> nodes being added/removed — setting selectEl.value programmatically (any
  // form-population code) changes no DOM structure at all, so the visible label never updated even
  // though the real underlying value was set correctly. A 'change' listener plus this exposed
  // resync method cover both cases.
  selectEl.addEventListener('change', sync);
  selectEl.btSync = sync;
  sync();
}

document.addEventListener('DOMContentLoaded', () => btEnhanceSelect(document.getElementById('msgSort')));
if (document.readyState !== 'loading') btEnhanceSelect(document.getElementById('msgSort'));
</script>
