<style>
  :root{
    --navy:#0A2547;
    --navy-2:#0E3D8F;
    --blue:#1E6ADB;
    --blue-bright:#5AAAFF;
    --blue-light:#EAF3FC;
    --bg:#F4F7FB;
    --card:#FFFFFF;
    --line:#E2E9F2;
    --ink:#0F1F33;
    --ink-soft:#64748B;
    --red:#C4432E;
    --green:#0F8A5F;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1280px;margin:0 auto;padding:0 24px 40px;}
  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:14px 32px 12px;margin-bottom:24px;}
  .brand-word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:#fff;line-height:1;}
  .brand-word span{color:var(--blue-bright);}
  .top-row{display:flex;justify-content:space-between;align-items:center;}
  .nav-row{display:flex;align-items:center;gap:5px;margin-top:22px;flex-wrap:wrap;}
  .nav-pill{display:inline-flex;align-items:center;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;letter-spacing:.2px;color:#fff;text-decoration:none;padding:7px 15px;border-radius:999px;transition:color .25s ease;white-space:nowrap;}
  .nav-pill.active{color:var(--blue-bright);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;}
  .btn.secondary{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red);padding:5px 10px;font-size:12px;}
  .btn.win{background:#fff;color:var(--green);border:1.5px solid var(--green);padding:5px 10px;font-size:12px;font-weight:700;}
  .btn.win:hover{background:var(--green);color:#fff;}
  .btn.lose{background:#fff;color:var(--ink-soft);border:1.5px solid var(--line);padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px;border-bottom:1.5px solid var(--line);white-space:nowrap;}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .field{margin-bottom:0;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:13.5px;font-family:inherit;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--blue);}
  .empty{color:var(--ink-soft);text-align:center;padding:24px;}
  .status-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .status-sent{background:var(--blue-light);color:var(--blue);}
  .status-won{background:#E3F6EC;color:var(--green);}
  .status-lost{background:var(--bg);color:var(--ink-soft);}
  .order-num{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--navy);}
</style>
</head>

<div class="wrap">

  <div class="card">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;align-items:end;">
      <div class="field"><label>Search (product, plant, customer)</label><input id="f_search" oninput="renderOffers()" placeholder="e.g. Trompa, Tyson…"></div>

<script>
let offers = [];

// Default view: last 30 days, so the list stays light — older sent-but-never-confirmed
// offers aren't deleted, just not shown unless you widen the date range or search.
function rqDefaultDates(){
  const to = new Date();
  const from = new Date(Date.now() - 30 * 86400000);
  const fmt = d => d.toISOString().slice(0, 10);
  document.getElementById('f_from').value = fmt(from);
  document.getElementById('f_to').value = fmt(to);
}

async function loadOffers(){
  const from = document.getElementById('f_from').value;
  const to = document.getElementById('f_to').value;
  let q = db.from('sent_offers').select('*').order('sent_at', { ascending: false });
  if (from) q = q.gte('sent_at', from + 'T00:00:00');
  if (to) q = q.lte('sent_at', to + 'T23:59:59');
  const { data, error } = await q;
  if (error){
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').textContent = 'Error loading offers: ' + error.message;
    return;
  }
  offers = data || [];
  renderOffers();
}

function renderOffers(){
  const term = (document.getElementById('f_search').value || '').trim().toLowerCase();
  const status = document.getElementById('f_status').value;
  const filtered = offers.filter(o => {
    if (status && o.status !== status) return false;
    if (!term) return true;
    return [o.product_name, o.plant_name, o.customer_name].some(v => (v || '').toLowerCase().includes(term));
  });
  const tbody = document.getElementById('offerRows');
  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
  document.getElementById('emptyState').textContent = 'No offers match.';
  tbody.innerHTML = filtered.map(o => {
    const sentDate = new Date(o.sent_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const statusPill = `<span class="status-pill status-${o.status}">${o.status}</span>`;
    let action = '';
    if (o.status === 'sent'){
      action = `<button class="btn win" onclick="markOffer('${o.id}','won')">✓ Ganada</button> <button class="btn lose" onclick="markOffer('${o.id}','lost')">✗ Perdida</button>`;
    } else if (o.status === 'won'){
      action = `<button class="btn secondary" style="padding:5px 10px;font-size:12px;" onclick="toggleReconcile('${o.id}')">Costos reales</button>`;
    }
    return `<tr>
      <td>${sentDate}</td>
      <td>${escapeHtml(o.product_name)}</td>
      <td>${escapeHtml(o.plant_name)}</td>
      <td>${escapeHtml(o.customer_name)}</td>
      <td>$${(o.sale_per_lb || 0).toFixed(4)}</td>
      <td>$${(o.total_sale || 0).toLocaleString('en-US', { maximumFractionDigits: 0 })}</td>
      <td>${o.channel}</td>
      <td>${statusPill}</td>
      <td>${o.order_number ? `<span class="order-num">${escapeHtml(o.order_number)}</span>` : '—'}</td>
      <td>${action}</td>
    </tr>
    <tr id="reconcile_row_${o.id}" style="display:none;"><td colspan="10" style="background:var(--bg);"><div id="reconcile_panel_${o.id}"></div></td></tr>`;
  }).join('');
}

// Inline, no navigation: opens right under the order's own row. Loads on demand (only when
// actually toggled open) rather than fetching this for every won row up front.
const EXTRA_COST_TYPES = ['Labels', 'Plastic wrap', 'IN-LIEU', 'Storage', 'Fresh to Frozen', 'Lumper fee', 'INBOND Release', 'Other'];
let reconcileOpenId = null;

async function toggleReconcile(offerId){
  const row = document.getElementById('reconcile_row_' + offerId);
  if (reconcileOpenId && reconcileOpenId !== offerId){
    const prev = document.getElementById('reconcile_row_' + reconcileOpenId);
    if (prev) prev.style.display = 'none';
  }
  if (row.style.display === 'table-row'){
    row.style.display = 'none';
    reconcileOpenId = null;
    return;
  }
  row.style.display = 'table-row';
  reconcileOpenId = offerId;
  await loadReconcilePanel(offerId);
}

async function loadReconcilePanel(offerId){
  const o = offers.find(x => x.id === offerId);
  const panel = document.getElementById('reconcile_panel_' + offerId);
  panel.innerHTML = '<span style="font-size:12.5px;color:var(--ink-soft);">Loading…</span>';
  const [foRes, costsRes] = await Promise.all([
    db.from('freight_orders').select('*').eq('order_number', o.order_number),
    db.from('order_extra_costs').select('*').eq('order_number', o.order_number).order('created_at'),
  ]);
  renderReconcilePanel(offerId, foRes.data || [], costsRes.data || []);
}

function renderReconcilePanel(offerId, freightOrders, costs){
  const panel = document.getElementById('reconcile_panel_' + offerId);
  const freightRows = freightOrders.map(fo => `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
      <span style="font-size:12.5px;width:180px;">${escapeHtml(fo.origin || '?')} → ${escapeHtml(fo.destination || '?')}</span>
      <span style="font-size:12px;color:var(--ink-soft);">Quoted: $${(fo.quoted_rate || 0).toLocaleString('en-US')}</span>
      <label style="font-size:12px;color:var(--ink-soft);">Actual:</label>
      <input type="number" step="0.01" value="${fo.actual_rate ?? ''}" placeholder="0.00" style="width:110px;padding:5px 8px;border:1.5px solid var(--line);border-radius:6px;font-size:13px;"
        onchange="saveActualRate('${fo.id}', this.value)">
    </div>`).join('') || '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;">No freight leg on this order.</div>';

  const costRows = costs.map(c => `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;font-size:12.5px;">
      <span style="width:150px;">${escapeHtml(c.cost_type)}</span>
      <span style="font-family:'IBM Plex Mono',monospace;">$${c.amount.toLocaleString('en-US')}</span>
      <button class="btn danger" style="padding:2px 8px;font-size:11px;" onclick="deleteExtraCost('${c.id}','${offerId}')">×</button>
    </div>`).join('');

  panel.innerHTML = `
    <div style="padding:12px 4px;">
      <div style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;">Freight — costo real</div>
      ${freightRows}
      <div style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px;">Sobrecostos</div>
      <div id="cost_list_${offerId}">${costRows}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
        <select id="cost_type_${offerId}" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;font-size:12.5px;">
          ${EXTRA_COST_TYPES.map(t => `<option>${t}</option>`).join('')}
        </select>
        <input type="number" step="0.01" id="cost_amount_${offerId}" placeholder="Monto" style="width:100px;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;font-size:12.5px;">
        <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="addExtraCost('${offerId}')">+ Agregar</button>
      </div>
    </div>`;
}

async function saveActualRate(freightOrderId, value){
  const amount = value.trim() === '' ? null : Number(value);
  const { error } = await db.from('freight_orders').update({ actual_rate: amount }).eq('id', freightOrderId);
  if (error) alert('Error: ' + error.message);
}

async function addExtraCost(offerId){
  const o = offers.find(x => x.id === offerId);
  const type = document.getElementById('cost_type_' + offerId).value;
  const amountInput = document.getElementById('cost_amount_' + offerId);
  const amount = Number(amountInput.value);
  if (!amount || amount <= 0) return;
  const { error } = await db.from('order_extra_costs').insert({
    order_number: o.order_number, sent_offer_id: o.id, cost_type: type, amount,
  });
  if (error){ alert('Error: ' + error.message); return; }
  amountInput.value = '';
  await loadReconcilePanel(offerId);
}

async function deleteExtraCost(costId, offerId){
  const { error } = await db.from('order_extra_costs').delete().eq('id', costId);
  if (error){ alert('Error: ' + error.message); return; }
  await loadReconcilePanel(offerId);
}

// Losing an offer just needs the status flip — no orders, nothing else to generate.
async function markOffer(id, status){
  if (status === 'lost'){
    const { error } = await db.from('sent_offers').update({ status: 'lost' }).eq('id', id);
    if (error){ alert('Error: ' + error.message); return; }
    loadOffers();
    return;
  }
  await markWon(id);
}

// Winning is the real event: stamp a consecutive order number on the offer, then spawn the
// PO (plant), SO (customer), and — only if freight was actually part of this deal — one
// freight_orders row per leg (US and/or Mexican), each resolved from the same provider_rates
// row the offer itself was built from.
async function markWon(id){
  const o = offers.find(x => x.id === id);
  if (!o) return;
  if (!confirm(`Marcar como Ganada: ${o.product_name} — ${o.plant_name} — ${o.customer_name}?`)) return;

  const { data: numRes, error: numErr } = await db.rpc('next_order_number');
  if (numErr){ alert('Error generating order number: ' + numErr.message); return; }
  const orderNumber = numRes;
  const who = (auth.currentUser && auth.currentUser.email) || null;

  const { error: updErr } = await db.from('sent_offers').update({
    status: 'won', order_number: orderNumber, won_at: new Date().toISOString(), won_by: who,
  }).eq('id', id);
  if (updErr){ alert('Error marking won: ' + updErr.message); return; }

  const { error: poErr } = await db.from('purchase_orders').insert({
    order_number: orderNumber, sent_offer_id: o.id, plant_id: o.plant_id, plant_name: o.plant_name,
    product_name: o.product_name, product_spec: o.product_spec, purchase_price: o.purchase_price,
    weight: o.weight, total_cost: o.total_cost, docs_on: o.docs_on, delivery_dates: o.delivery_dates,
  });
  if (poErr) console.error('PO insert failed:', poErr.message);

  const { error: soErr } = await db.from('sales_orders').insert({
    order_number: orderNumber, sent_offer_id: o.id, customer_id: o.customer_id, customer_name: o.customer_name,
    product_name: o.product_name, product_spec: o.product_spec, sale_price: o.sale_per_lb,
    weight: o.weight, total_sale: o.total_sale, delivery_dates: o.delivery_dates,
  });
  if (soErr) console.error('SO insert failed:', soErr.message);

  if (o.us_freight_rate_id && o.us_freight_amount > 0){
    const { data: rate } = await db.from('provider_rates').select('provider_id,origin').eq('id', o.us_freight_rate_id).single();
    const { error: foErr } = await db.from('freight_orders').insert({
      order_number: orderNumber, sent_offer_id: o.id, carrier_provider_id: rate ? rate.provider_id : null,
      origin: rate ? rate.origin : null, destination: 'Border', quoted_rate: o.us_freight_amount, currency: 'USD',
    });
    if (foErr) console.error('FO (US freight) insert failed:', foErr.message);
  }

  if (o.mexican_dest_rate_id && o.mexican_freight_mxn){
    const { data: rate } = await db.from('provider_rates').select('provider_id,destination,rate').eq('id', o.mexican_dest_rate_id).single();
    const { error: foErr } = await db.from('freight_orders').insert({
      order_number: orderNumber, sent_offer_id: o.id, carrier_provider_id: rate ? rate.provider_id : null,
      origin: 'Border', destination: rate ? rate.destination : null, quoted_rate: rate ? rate.rate : null, currency: 'USD',
    });
    if (foErr) console.error('FO (Mexican freight) insert failed:', foErr.message);
  }

  alert(`Orden ${orderNumber} creada.`);
  loadOffers();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

rqDefaultDates();
</script>
