<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuenTrade Trading OS — Plants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A2547; --navy-2:#0E3D8F; --blue:#1E6ADB; --blue-bright:#5AAAFF;
    --bg:#F4F7FB; --card:#FFFFFF; --line:#E2E9F2; --ink:#0F1F33; --ink-soft:#64748B; --red:#C4432E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px 40px;}
  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:16px 32px;margin-bottom:24px;}
  .brand-word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:#fff;}
  .brand-word span{color:var(--blue-bright);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;}
  .btn.secondary{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red);padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px;border-bottom:1.5px solid var(--line);}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:13.5px;font-family:inherit;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px;}
  .empty{color:var(--ink-soft);text-align:center;padding:24px;}
  .row-actions{display:flex;gap:6px;}
  #formCard{display:none;}
  .thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;background:var(--line);display:block;}
  .photo-preview{width:120px;height:120px;border-radius:10px;object-fit:cover;background:var(--line);display:block;margin-bottom:8px;}
  #plantSelect{width:100%;max-width:420px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
</style>
</head>
<body>

<!-- ============ LOGIN GATE ============ -->
<style>
  #authGate{position:fixed;inset:0;background:linear-gradient(135deg,#0B2545 0%,#123A6B 100%);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;}
  .auth-box{background:#fff;border-radius:16px;width:100%;max-width:380px;padding:32px 30px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;}
  .auth-logo .word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:#0B2545;}
  .auth-logo .word span{color:#1B6FC9;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:12px;font-weight:600;color:#5B6B82;margin-bottom:5px;}
  .auth-field input{width:100%;padding:10px 12px;border:1.5px solid #E1E6ED;border-radius:8px;font-size:14px;font-family:inherit;}
  .auth-submit{width:100%;padding:11px;border:none;border-radius:8px;background:#1B6FC9;color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;}
  .auth-msg{font-size:12.5px;margin-top:12px;padding:9px 11px;border-radius:8px;line-height:1.4;display:none;}
  .auth-msg.err{background:#FCEBE7;color:#B23A22;display:block;}
  .auth-note{font-size:11px;color:#9AABC2;text-align:center;margin-top:16px;line-height:1.5;}
</style>
<div id="authGate">
  <div class="auth-box">
    <div class="auth-logo">
      <svg viewBox="0 0 44 44" width="30" height="30"><circle cx="22" cy="22" r="21" fill="#123A6B" stroke="#3E7BC4" stroke-width="1.2"/><path d="M6,25 C13,19 17,29 24,23 C30,18 34,24 38,20" stroke="#5FA8E8" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="16" y="14" width="13" height="8" rx="1.4" fill="#00A9A0"/></svg>
      <div class="word">Buen<span>Trade</span> Trading OS</div>
    </div>
    <form id="formSignIn" onsubmit="return doSignIn(event)">
      <div class="auth-field"><label>Work email</label><input type="email" id="siEmail" required></div>
      <div class="auth-field"><label>Password</label><input type="password" id="siPass" required></div>
      <button class="auth-submit" type="submit">Sign In</button>
    </form>
    <div id="authMsg" class="auth-msg"></div>
    <div class="auth-note">Accounts are created from the Trading Tool. Same login works here.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyApz__ZGeVwgt1ObJYCQ6elVa9KXFZA3tM",
  authDomain: "buentrade-fc841.firebaseapp.com",
  projectId: "buentrade-fc841",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const SUPABASE_URL = "https://zhtvimnaeogywmjuomiz.supabase.co";
const SUPABASE_KEY = "sb_publishable_bcyFUZhQKaYTFDLxzJh2qw_yBWgBAEu";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  accessToken: async () => {
    const user = auth.currentUser;
    return user ? await user.getIdToken(true) : null;
  }
});

function showAuthMsg(text){
  const el = document.getElementById('authMsg');
  el.textContent = text;
  el.className = 'auth-msg err';
}
function doSignIn(e){
  e.preventDefault();
  const email = document.getElementById('siEmail').value;
  const pass = document.getElementById('siPass').value;
  auth.signInWithEmailAndPassword(email, pass)
    .then(cred => {
      if(!cred.user.emailVerified){ showAuthMsg('Please verify your email first.'); auth.signOut(); }
    })
    .catch(err => showAuthMsg(err.message));
  return false;
}
function logout(){ auth.signOut(); }
auth.onAuthStateChanged(user => {
  const gate = document.getElementById('authGate');
  const app = document.getElementById('appContent');
  if (user && user.emailVerified) {
    gate.style.display = 'none';
    app.style.display = 'block';
    document.getElementById('userBadge').textContent = user.email;
    loadEverything();
  } else {
    gate.style.display = 'flex';
    app.style.display = 'none';
  }
});
</script>
<!-- ============ END LOGIN GATE ============ -->

<div id="appContent" style="display:none;">
<header>
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="brand-word">Buen<span>Trade</span> Trading OS</div>
      <a href="customers.html" style="font-size:12px;color:#BBD4EE;text-decoration:none;">Customers</a>
      <a href="suppliers.html" style="font-size:12px;color:#BBD4EE;text-decoration:none;">Suppliers</a>
      <a href="products.html" style="font-size:12px;color:#BBD4EE;text-decoration:none;">Products</a>
      <a href="trading-tool.html" style="font-size:12px;color:#BBD4EE;text-decoration:none;">Trading Tool →</a>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <button onclick="logout()" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;">Log Out</button>
      <span id="userBadge" style="font-size:11px;color:#BBD4EE;font-family:'IBM Plex Mono',monospace;"></span>
    </div>
  </div>
</header>

<div class="wrap">
  <h1>Plants</h1>

  <div class="card">
    <div class="field" style="max-width:420px;">
      <label>Choose a plant (by supplier name)</label>
      <select id="plantSelect" onchange="selectPlant()">
        <option value="">— Select a plant —</option>
      </select>
    </div>
    <button class="btn secondary" onclick="openNewPlant()">+ New plant (existing supplier without one yet)</button>
  </div>

  <div class="card" id="plantCard" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <strong id="plantTitle"></strong>
      <button class="btn" onclick="openProductForm()">+ Add Product to this Plant</button>
    </div>
    <table>
      <thead><tr><th>Photo</th><th>Name (ES)</th><th>Name (EN)</th><th>Category</th><th>Subcategory</th><th>Temp/Pack</th><th></th></tr></thead>
      <tbody id="plantProductRows"></tbody>
    </table>
    <div id="plantEmpty" class="empty" style="display:none;">No products linked to this plant yet.</div>
  </div>

  <div class="card" id="newPlantCard" style="display:none;">
    <strong>New plant</strong>
    <div class="field" style="margin-top:12px;"><label>Supplier</label>
      <select id="newPlantSupplier"></select>
    </div>
    <div class="field"><label>Plant name</label><input id="newPlantName" placeholder="e.g. Tyson — Waterloo"></div>
    <div style="display:flex;gap:10px;"><button class="btn" onclick="saveNewPlant()">Create Plant</button><button class="btn secondary" onclick="document.getElementById('newPlantCard').style.display='none'">Cancel</button></div>
    <div id="newPlantMsg" style="font-size:12.5px;margin-top:10px;"></div>
  </div>

  <div class="card" id="formCard">
    <strong id="formTitle">New product</strong>
    <input type="hidden" id="prodId">

    <div class="section-title">Photo / Attachment</div>
    <img id="photoPreview" class="photo-preview" style="display:none;">
    <div id="filePreview" style="display:none;margin-bottom:8px;"></div>
    <input type="file" id="photoFile">
    <div id="photoMsg" style="font-size:12px;color:var(--ink-soft);margin-top:4px;"></div>

    <div class="grid2" style="margin-top:14px;">
      <div class="field"><label>Name (Spanish) *</label><input id="name" required></div>
      <div class="field"><label>Name (English)</label><input id="name_en"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Category *</label><input id="category" required></div>
      <div class="field"><label>Subcategory (ES)</label><input id="subcategory"></div>
      <div class="field"><label>Subcategory (EN)</label><input id="subcategory_en"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Brand</label><input id="brand"></div>
      <div class="field"><label>Temperature</label><select id="temperature_id"><option value="">—</option></select></div>
      <div class="field"><label>Packaging</label><select id="packaging_id"><option value="">—</option></select></div>
    </div>
    <div class="field"><label>Presentation detail</label><input id="presentation"></div>
    <div class="field"><label>Notes</label><textarea id="commercial_notes" rows="2"></textarea></div>

    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn" onclick="saveProduct()">Save</button>
      <button class="btn secondary" onclick="closeForm()">Cancel</button>
    </div>
    <div id="formMsg" style="font-size:12.5px;margin-top:10px;"></div>
  </div>
</div>
</div>

<script>
let plants = [];
let suppliers = [];
let temperatures = [];
let packagings = [];
let plantProducts = []; // products linked to the currently selected plant
let currentPlantId = null;
let pendingPhotoFile = null;

async function loadEverything(){
  const [plantsRes, suppliersRes, tempRes, packRes] = await Promise.all([
    db.from('plants').select('*').order('name'),
    db.from('suppliers').select('*').order('name'),
    db.from('temperature').select('*').order('name'),
    db.from('packaging').select('*').order('name'),
  ]);
  plants = plantsRes.data || [];
  suppliers = suppliersRes.data || [];
  temperatures = tempRes.data || [];
  packagings = packRes.data || [];

  const sel = document.getElementById('plantSelect');
  plants.forEach(p => sel.innerHTML += `<option value="${p.id}">${escapeHtml(p.name)}</option>`);

  const tSel = document.getElementById('temperature_id');
  temperatures.forEach(t => tSel.innerHTML += `<option value="${t.id}">${escapeHtml(t.name)}</option>`);
  const pSel = document.getElementById('packaging_id');
  packagings.forEach(p => pSel.innerHTML += `<option value="${p.id}">${escapeHtml(p.name)}</option>`);

  const supSel = document.getElementById('newPlantSupplier');
  suppliers.forEach(s => supSel.innerHTML += `<option value="${s.id}">${escapeHtml(s.name)}</option>`);
}

function openNewPlant(){
  document.getElementById('newPlantCard').style.display = 'block';
  document.getElementById('newPlantCard').scrollIntoView({behavior:'smooth'});
}

async function saveNewPlant(){
  const supplierId = document.getElementById('newPlantSupplier').value;
  const name = document.getElementById('newPlantName').value;
  if (!supplierId || !name){
    document.getElementById('newPlantMsg').textContent = 'Pick a supplier and enter a plant name.';
    return;
  }
  const { data, error } = await db.from('plants').insert({ supplier_id: supplierId, name }).select();
  if (error){
    document.getElementById('newPlantMsg').textContent = 'Error: ' + error.message;
    return;
  }
  document.getElementById('newPlantCard').style.display = 'none';
  await loadEverything();
  document.getElementById('plantSelect').value = data[0].id;
  selectPlant();
}

async function selectPlant(){
  currentPlantId = document.getElementById('plantSelect').value;
  if (!currentPlantId){
    document.getElementById('plantCard').style.display = 'none';
    return;
  }
  const plant = plants.find(p => p.id === currentPlantId);
  document.getElementById('plantTitle').textContent = plant.name;
  document.getElementById('plantCard').style.display = 'block';
  await loadPlantProducts();
}

async function loadPlantProducts(){
  const { data, error } = await db
    .from('plant_products')
    .select('id, products(*)')
    .eq('plant_id', currentPlantId);
  if (error){
    document.getElementById('plantEmpty').style.display = 'block';
    document.getElementById('plantEmpty').textContent = 'Error loading products: ' + error.message;
    return;
  }
  plantProducts = (data || []).map(r => r.products).filter(Boolean);
  renderPlantProducts();
}

function tempName(id){ const t = temperatures.find(x => x.id === id); return t ? t.name : null; }
function packName(id){ const p = packagings.find(x => x.id === id); return p ? p.name : null; }

function renderPlantProducts(){
  const tbody = document.getElementById('plantProductRows');
  tbody.innerHTML = '';
  document.getElementById('plantEmpty').style.display = plantProducts.length ? 'none' : 'block';
  document.getElementById('plantEmpty').textContent = 'No products linked to this plant yet.';
  plantProducts.forEach(p => {
    const isImg = p.photo_url && /\.(png|jpe?g|gif|webp)(\?|$)/i.test(p.photo_url);
    const thumb = p.photo_url
      ? (isImg ? `<img class="thumb" src="${p.photo_url}">` : `<a href="${p.photo_url}" target="_blank" rel="noopener">📄</a>`)
      : '';
    const tp = [tempName(p.temperature_id), packName(p.packaging_id)].filter(Boolean).join(' / ') || '—';
    const sub = [p.subcategory, p.subcategory_en].filter(Boolean).join(' / ') || '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${thumb}</td>
      <td><strong>${escapeHtml(p.name || '')}</strong></td>
      <td>${escapeHtml(p.name_en || '—')}</td>
      <td>${escapeHtml(p.category || '')}</td>
      <td>${escapeHtml(sub)}</td>
      <td>${escapeHtml(tp)}</td>
      <td class="row-actions">
        <button class="btn secondary" style="padding:5px 10px;font-size:12px;" onclick="editProduct('${p.id}')">Edit</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

function editProduct(id){
  const p = plantProducts.find(x => x.id === id);
  if (p) openProductForm(p);
}

function openProductForm(product){
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('formTitle').textContent = product ? 'Edit product' : 'New product for this plant';
  const fields = ['prodId','name','name_en','category','subcategory','subcategory_en','brand','temperature_id','packaging_id','presentation','commercial_notes'];
  fields.forEach(f => document.getElementById(f).value = '');
  pendingPhotoFile = null;
  document.getElementById('photoFile').value = '';
  const preview = document.getElementById('photoPreview');
  const filePrev = document.getElementById('filePreview');
  preview.style.display = 'none';
  filePrev.style.display = 'none';
  filePrev.innerHTML = '';
  document.getElementById('photoMsg').textContent = '';
  if (product){
    document.getElementById('prodId').value = product.id;
    fields.slice(1).forEach(f => {
      if (product[f] !== undefined && product[f] !== null) document.getElementById(f).value = product[f];
    });
    if (product.photo_url) showFilePreview(product.photo_url, preview, filePrev);
  }
  document.getElementById('formMsg').textContent = '';
  document.getElementById('formCard').scrollIntoView({behavior:'smooth'});
}

function closeForm(){ document.getElementById('formCard').style.display = 'none'; }

function showFilePreview(url, imgEl, containerEl){
  const isImage = /\.(png|jpe?g|gif|webp)(\?|$)/i.test(url);
  if (isImage){
    imgEl.src = url; imgEl.style.display = 'block'; containerEl.style.display = 'none';
  } else {
    imgEl.style.display = 'none';
    const filename = decodeURIComponent(url.split('/').pop());
    containerEl.innerHTML = `<a href="${url}" target="_blank" rel="noopener">📄 ${escapeHtml(filename)}</a>`;
    containerEl.style.display = 'block';
  }
}

document.getElementById('photoFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  pendingPhotoFile = file;
  const preview = document.getElementById('photoPreview');
  const filePrev = document.getElementById('filePreview');
  if (file.type.startsWith('image/')){
    preview.src = URL.createObjectURL(file); preview.style.display = 'block'; filePrev.style.display = 'none';
  } else {
    preview.style.display = 'none';
    filePrev.innerHTML = `📄 ${escapeHtml(file.name)}`;
    filePrev.style.display = 'block';
  }
});

async function saveProduct(){
  const id = document.getElementById('prodId').value;
  const payload = {
    name: document.getElementById('name').value,
    name_en: document.getElementById('name_en').value || null,
    category: document.getElementById('category').value,
    subcategory: document.getElementById('subcategory').value || null,
    subcategory_en: document.getElementById('subcategory_en').value || null,
    brand: document.getElementById('brand').value || null,
    temperature_id: document.getElementById('temperature_id').value || null,
    packaging_id: document.getElementById('packaging_id').value || null,
    presentation: document.getElementById('presentation').value || null,
    commercial_notes: document.getElementById('commercial_notes').value || null,
  };
  if (!payload.name || !payload.category){
    document.getElementById('formMsg').textContent = 'Name and category are required.';
    return;
  }
  if (pendingPhotoFile){
    document.getElementById('photoMsg').textContent = 'Uploading…';
    const ext = pendingPhotoFile.name.split('.').pop();
    const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const { error: upErr } = await db.storage.from('product-photos').upload(path, pendingPhotoFile);
    if (upErr){ document.getElementById('photoMsg').textContent = 'Upload failed: ' + upErr.message; return; }
    const { data: pub } = db.storage.from('product-photos').getPublicUrl(path);
    payload.photo_url = pub.publicUrl;
    document.getElementById('photoMsg').textContent = '';
  }

  let productId = id;
  if (id){
    const { error } = await db.from('products').update(payload).eq('id', id);
    if (error){ document.getElementById('formMsg').textContent = 'Error: ' + error.message; return; }
  } else {
    const { data, error } = await db.from('products').insert(payload).select();
    if (error){ document.getElementById('formMsg').textContent = 'Error: ' + error.message; return; }
    productId = data[0].id;
    await db.from('plant_products').insert({ plant_id: currentPlantId, product_id: productId });
  }
  closeForm();
  await loadPlantProducts();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
